whatsNewPasteOnClickStep4=En el punto 5 no hay globo: en Photoshop, toma el Marco rectangular (M) y dibuja un rectángulo dentro del marco punteado. La línea se pega en cuanto sueltas.
whatsNewPasteOnClickResult4=Un rectángulo o un lazo coloca el texto en cualquier sitio, incluso sobre el dibujo: útil para cartelas y texto fuera de los globos.
whatsNewBubblesStep6=Los cuadros de narración funcionan igual, con el estilo marcado como «Narración». Crea uno también a partir de tu estilo de diálogo: clic derecho sobre él en la lista y luego «Duplicar estilo».
whatsNewBubblesCoach6=Renómbralo «Narración», pon Tipo de globo en Narración, elige la fuente de tus cartelas y haz clic en Guardar.
whatsNewBubblesResult6=El estilo Narración solo se usa en los cuadros detectados como narración.
whatsNewBubblesStep7=El cuadro 10 es un cuadro de narración: pega en él la última línea.
whatsNewBubblesResult7=TypeR reconoció un cuadro de narración y usó el estilo Narración.
whatsNewBubblesResult7Missed=No se usó el estilo Narración: comprueba que está en la misma carpeta que el estilo actual y vuelve a intentarlo.
whatsNewAgainNarration=Ya tienes un estilo «Narración» de una vez anterior: crea uno nuevo para hacer este paso.
whatsNewPasteOnClickStep3Again=¡Deshecho! Ahora haz clic otra vez dentro del globo 4 con la varita mágica para volver a pegarlo.
whatsNewNextLocked=Haz los pasos de este capítulo para continuar.
whatsNewChapterLocked=Termina primero los capítulos anteriores.
