whatsNewPrepTitle=Preparación
whatsNewPrepIntro=El recorrido es práctico: TypeR abre una página de práctica con globos numerados y un guion de práctica, una línea por globo.
whatsNewPrepOpenText=Abre la página de práctica en Photoshop.
whatsNewPrepOpenResult=Se abre como un documento normal: 10 puntos numerados, uno por ejercicio, que se leen de derecha a izquierda como un manga. Ciérrala sin guardar al final.
whatsNewPrepScriptText=Carga el guion de práctica. Se abre en una pestaña nueva: tus guiones no se tocan.
whatsNewPrepScriptResult=Cada línea de este guion va en el globo con el mismo número.
whatsNewPrepStyleText=En la lista de estilos, haz clic en el estilo que sueles usar para los diálogos. Los ejercicios lo utilizan.
whatsNewPrepStyleResult=Listo. Deja esta guía abierta: comprueba cada ejercicio por sí sola.
whatsNewSmartPasteTitle=Pegado inteligente
whatsNewSmartPasteIntro=Hasta la 2.5, el texto llenaba el rectángulo de la selección. Ahora TypeR lee el contorno real del globo y coloca el texto dentro.
whatsNewSmartPasteStep1=Globo 1: en Photoshop, toma la varita mágica (W) y haz clic dentro del globo grande. Luego haz clic en Pegar en el panel.
whatsNewSmartPasteResult1=Las líneas siguen la curva: cortas arriba y abajo, largas en el centro, y el bloque queda centrado en el globo. Se mantuvo el tamaño del estilo porque el texto cabe.
whatsNewSmartPasteStep2=Globo 2: el mismo gesto en el globo pequeño. Esta línea es demasiado larga para él…
whatsNewSmartPasteResult2=…así que TypeR redujo el texto lo justo para que quepa, como mucho hasta el 75 % del tamaño del estilo. Solo se permite un guion como último recurso. Ambos se cambian en Configuración > Inserción.
whatsNewPasteOnClickTitle=Pegar con clic
whatsNewPasteOnClickIntro=Ya no hace falta pegar: basta con la selección. Cada clic con la varita mágica (o rectángulo, o lazo) pega la línea actual y pasa a la siguiente.
whatsNewPasteOnClickStep1=Activa «Pegar con clic» en la parte inferior del panel.
whatsNewPasteOnClickResult1=Está activo. El modo multiglobo se desactiva: los dos no van juntos.
whatsNewPasteOnClickStep2=Con la varita mágica, haz clic dentro del globo 3 y luego dentro del globo 4. Nada más.
whatsNewPasteOnClickResult2=Un clic, una línea: TypeR sigue tus clics por el guion.
whatsNewPasteOnClickStep3Uxp=Pulsa Ctrl+Z (Cmd+Z en Mac) en Photoshop: el texto del globo 4 desaparece y su línea vuelve a ser la línea actual.
whatsNewPasteOnClickStep3Legacy=Pulsa Ctrl+Z (Cmd+Z en Mac) en Photoshop y luego haz clic en el panel de TypeR: el texto del globo 4 desaparece y su línea vuelve a ser la línea actual.
whatsNewPasteOnClickResult3=El globo 4 ha vuelto. Desactiva el modo cuando retoques la página, o cada selección pegará una línea.
whatsNewBubblesTitle=Todo tipo de globos
whatsNewBubblesIntro=El pegado inteligente reconoce el tipo de globo y adapta el texto. Pegar con clic puede seguir activo: un clic por globo.
whatsNewBubblesStep1=El globo 6 es negro: pega en él la línea siguiente.
whatsNewBubblesResult1=Texto blanco sin contorno, automáticamente. Tu estilo no cambia.
whatsNewBubblesStep2=El globo 7 es doble: un solo clic o un solo pegado en su parte superior.
whatsNewBubblesResult2=Dos líneas, una por parte, en un solo paso del historial: un Ctrl+Z deshace ambas. Los globos triples funcionan igual. Si TypeR pone una sola línea en un globo doble, vuelva a hacer clic en el mismo globo: lo divide y pega la línea siguiente en la otra parte.
whatsNewBubblesStep3=Para los globos de grito, TypeR usa el estilo marcado como «Grito» en la carpeta del estilo actual. Haz clic en el lápiz del estilo que quieras para ellos, que no sea tu estilo de diálogo. O crea uno: clic derecho sobre tu estilo de diálogo y luego «Duplicar estilo».
whatsNewBubblesResult3=El estilo Grito solo se usa en los globos detectados como gritos. Un prefijo en la línea del guion siempre tiene prioridad.
whatsNewBubblesResult3Existing=Tu estilo «{name}» ya está marcado como Grito: TypeR solo lo usa en los globos detectados como gritos. Un prefijo en la línea del guion siempre tiene prioridad.
whatsNewBubblesStep4=El globo 9 tiene picos: pega en él la línea siguiente. Tu estilo actual no es el estilo Grito.
whatsNewBubblesResult4=TypeR reconoció un grito y usó el estilo Grito en lugar del estilo actual.
whatsNewBubblesResult4Missed=No se usó el estilo Grito: comprueba que está en la misma carpeta que el estilo actual y vuelve a intentarlo.
whatsNewBubblesStep5=El globo 8 aún tiene su rotulado original. Activa la limpieza auto y pega en él la línea siguiente.
whatsNewBubblesResult5=Una capa «TypeR Clean» pintó el globo bajo el texto: el rotulado original queda oculto, no se borra nada. Solo funciona en globos lisos blancos o negros.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR propone varias formas de cortar las líneas de una capa de texto según su globo, de la mejor a la peor. Útil para retocar un globo ya rotulado.
whatsNewTextShapeRStep1=Activa «TextShapeR» en la parte inferior del panel.
whatsNewTextShapeRResult1=Las propuestas aparecen en el panel, bajo la vista previa. Pliega esta guía (▾) para verlas.
whatsNewTextShapeRStep2=En Photoshop, selecciona una capa de texto en el panel Capas y luego haz clic en una de las formas propuestas en TypeR.
whatsNewTextShapeRResult2=La capa recibe los nuevos cortes. Mayús+clic aplica y pasa a la línea siguiente; Ctrl+Z deshace.
whatsNewTextShapeRStep3=Cuando una propuesta te guste, haz clic en su estrella: TextShapeR aprende cómo cortas las líneas (sin IA generativa).
whatsNewTextShapeRResult3=Las siguientes propuestas siguen tu estilo. Esta lección es solo para el recorrido: se deshace al salir de este capítulo y tu propio aprendizaje queda como estaba.
whatsNewWorkflowTitle=Organiza tu trabajo
whatsNewWorkflowIntro=Varios capítulos, equipos o proyectos a la vez, sin mezclar nada.
whatsNewWorkflowStep1=Pestañas: haz clic en tu pestaña anterior, encima del guion, y vuelve a la pestaña de práctica. Cada pestaña guarda su guion, su línea actual y su carpeta de PSD.
whatsNewWorkflowResult1=Haz doble clic en una pestaña para renombrarla. Arrástrala para cambiar el orden. El botón + abre una nueva.
whatsNewWorkflowStep3=Tamaños predefinidos: haz clic en el lápiz de tu estilo actual para abrir el editor de estilos.
whatsNewWorkflowResult3=El atajo «Siguiente preajuste de tamaño de texto» los recorre sin abrir nada.
