whatsNewPrepStyleCreateText=Aún no tienes ningún estilo: haz clic en «Añadir estilo» bajo la lista de estilos para crear tu estilo de diálogo.
whatsNewPrepStyleCoach=Ponle nombre al estilo, elige la fuente que usas para los diálogos y haz clic en Guardar.
whatsNewBubblesStep3Edit=Ahora haz clic en el lápiz de la copia para editarla.
whatsNewBubblesCoach3=Renómbralo «Grito», pon Tipo de globo en Grito, elige una fuente que grite y haz clic en Guardar.
whatsNewWorkflowCoach3=Preajustes de tamaño de texto: añade hasta tres tamaños y haz clic en uno para activarlo. El atajo «Siguiente preajuste de tamaño de texto» pasa de uno a otro.
