## walkthrough
walkthroughTitle=Guía de TypeR
walkthroughCoachTitle=Guía de TypeR
walkthroughPracticeTab=Práctica de TypeR
walkthroughPracticeNote=Nota del traductor: las líneas que empiezan por ## nunca se pegan.
walkthroughPracticeLine1=¡Bienvenido a TypeR! Cada línea del guion va en su propio globo.
