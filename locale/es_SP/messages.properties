walkthroughIntroSpot=Haces cada gesto tú mismo: la guía resalta el botón que debes usar en el panel. Arrastra la guía por su cabecera o pliégala con ▴.
walkthroughDoneHelp=La ayuda, el ? en la parte inferior del panel, presenta cada función y tus atajos.
walkthroughDoneText=Vuelve a abrir esta guía cuando quieras desde la Ayuda.
walkthroughPartBasics=Lo básico
walkthroughPartMore=Para ir más allá
walkthroughMorePrepTitle=Siguiente página de práctica
walkthroughMorePrepIntro=Ya conoces lo básico: ahora, lo que TypeR hace por ti. Esta parte tiene su propia página de práctica con globos numerados y su propio guion, una línea por globo.
walkthroughMoreSmartPasteIntro=TypeR lee el contorno real de un globo y coloca el texto dentro, incluso cuando es demasiado largo para él.
walkthroughDoneCleanup=Cierra las dos páginas de práctica en Photoshop sin guardarlas.
walkthroughCloseTabs=Cerrar las pestañas de práctica
walkthroughPrepTitle=Preparación
walkthroughPrepIntro=La guía es práctica: TypeR abre una página de práctica con cuatro puntos numerados y un guion de práctica corto, una línea por punto.
walkthroughPrepOpenText=Abre la página de práctica en Photoshop.
walkthroughPrepOpenResult=Se abre como un documento normal: 4 puntos numerados, que se leen de derecha a izquierda como un manga. Ciérrala sin guardar al final.
walkthroughPrepScriptText=Carga el guion de práctica. Se abre en una pestaña nueva: tus propios guiones no se tocan.
walkthroughPrepScriptResult=Aquí va tu traducción: pégala en el bloque de texto y TypeR la divide en líneas.
walkthroughScriptTitle=Leer el guion
walkthroughScriptIntro=TypeR siempre trabaja con una línea del guion, la línea actual: es el texto del próximo pegado.
walkthroughScriptStep1=En el guion, haz clic en el objetivo al principio de la línea 2: se convierte en la línea actual.
walkthroughScriptResult1=La línea actual está resaltada: es el texto del próximo pegado.
walkthroughScriptStep2=Ahora pasa a la línea siguiente con la flecha ↓ bajo la vista previa, o con tu atajo.
walkthroughScriptResult2=TypeR se saltó la línea que empieza por ##: es una nota para ti y nunca se pega. «Page 1» arriba es un marcador de página, que también se salta.
walkthroughStyleTitle=Tu estilo de diálogo
walkthroughStyleIntro=Un estilo es todo lo que necesita una capa de texto: fuente, tamaño, color, trazo, espaciado. TypeR lo aplica a cada texto que pegas.
walkthroughStyleStep1=Haz clic en «Añadir estilo» bajo la lista de estilos.
walkthroughStyleStep1Existing=Haz clic en la lista en el estilo que usas para los diálogos, sea cual sea su nombre. ¿Ninguno sirve? Haz clic en «Añadir estilo» bajo la lista.
walkthroughStyleCoach1=Ponle el nombre que quieras, elige la fuente y el tamaño de tus diálogos y haz clic en Guardar.
walkthroughStyleResult1=Tu estilo está en la lista y activo. Haz clic en un estilo para activarlo; su lápiz lo edita.
walkthroughStyleResult1Existing=«{name}» es tu estilo de diálogo para este tutorial: cada pegado lo usa. Haz clic en un estilo para activarlo; su lápiz lo edita.
walkthroughPasteTitle=Pegar el texto
walkthroughPasteIntro=El ciclo básico: selecciona un globo en Photoshop, pega, y TypeR pasa a la línea siguiente.
walkthroughPasteStep1=Globo 1: en Photoshop, toma la varita mágica (W) y haz clic dentro del globo grande. Luego haz clic en Pegar en el panel.
walkthroughPasteResult1=Una capa de texto con tu estilo, centrada en el globo: las líneas siguen su forma redonda. TypeR pasó solo a la línea 2.
walkthroughPasteStep2=Globo 2: el mismo gesto, y esta vez pega con tu atajo.
walkthroughPasteResult2=Selección, pegado: ese es todo el ciclo. Con el atajo, tus manos nunca salen de Photoshop.
walkthroughPasteStep3=En el punto 3 no hay globo: toma el Marco rectangular (M), dibuja un rectángulo dentro del marco punteado y luego pega.
walkthroughPasteResult3=Un rectángulo o un lazo coloca el texto en cualquier sitio: cartelas, texto sobre el dibujo…
walkthroughShoutTitle=Un estilo por tipo de texto
walkthroughShoutIntro=Una etiqueta al principio de una línea del guion elige su estilo: la línea se pega con ese estilo, sin la etiqueta.
walkthroughShoutStep1=La línea 4 empieza por una etiqueta. Crea su estilo a partir de tu estilo de diálogo: clic derecho sobre él en la lista y luego «Duplicar estilo».
walkthroughShoutStep1Edit=Ahora haz clic en el lápiz de la copia para editarla.
walkthroughShoutStep1Reuse=La línea 4 empieza por una etiqueta. Ya tienes un estilo para los gritos, «{name}»: ponle esta etiqueta en lugar de crear uno nuevo. Haz clic en su lápiz.
walkthroughShoutCoach1=Escribe {prefix} en «Etiquetas para la elección automática de estilo», elige una fuente más gruesa y otro nombre si quieres y haz clic en Guardar.
walkthroughShoutCoach1Reuse=Escribe {prefix} en «Etiquetas para la elección automática de estilo» y haz clic en Guardar.
walkthroughShoutResult1=Cada línea que empieza por {prefix} recibe ahora el estilo Grito: TypeR lo convierte en el estilo actual en cuanto esa línea es la línea actual.
walkthroughShoutResult1Existing=Tu estilo «{name}» ya tiene la etiqueta {prefix}: cada línea que empieza por ella recibe ese estilo en cuanto es la línea actual.
walkthroughShoutStep2=El globo 4 tiene picos: pega en él la línea 4.
walkthroughShoutResult2=La etiqueta eligió el estilo Grito y no aparece en el texto. Una etiqueta siempre tiene prioridad: el estilo que el pegado inteligente elige para los globos de pinchos solo va a las líneas sin etiqueta.
walkthroughShoutResult2Missed=Este texto no recibió el estilo Grito. Deshazlo en Photoshop (Ctrl+Z, Cmd+Z en Mac), comprueba que la etiqueta del estilo Grito está escrita exactamente como en el guion y que está en la misma carpeta que tu estilo de diálogo, y vuelve a pegar la línea 4.
walkthroughRetouchTitle=Retocar un texto
walkthroughRetouchIntro=Un texto que ya está en la página puede volver a centrarse o tomar otro estilo, sin escribirlo de nuevo.
walkthroughRetouchStep1=En Photoshop, descentra el texto del globo 1 con la herramienta Mover (V). Luego vuelve a seleccionar el globo 1 con la varita mágica y haz clic en Alinear.
walkthroughRetouchResult1=El texto volvió al centro de la selección. Útil después de cambiar el tamaño de un texto.
walkthroughRetouchStep2=Selecciona la capa de texto del globo 2 en el panel Capas y luego haz clic en el botón ➜ del estilo Grito en la lista.
walkthroughRetouchResult2=La capa tomó el estilo Grito y conservó su texto. Ctrl+clic en ➜ también conserva su tamaño actual.
walkthroughPagesTitle=Sigue tus páginas
walkthroughPagesIntro=Vincula los PSD de un capítulo a tu guion: a medida que avanzas por las líneas, TypeR abre la página a la que pertenecen.
walkthroughPagesStep1=Haz clic en el icono de carpeta (Importar páginas) en la parte inferior del panel y selecciona los PSD de un capítulo. ¿No tienes ninguno a mano? Haz clic en Omitir.
walkthroughPagesResult1=TypeR abrió el archivo de la página 1. Cada línea «Page 12» de un guion abre ahora el archivo con ese número en su nombre. El mismo botón quita el vínculo.
walkthroughBackupTitle=Respaldar tus estilos
walkthroughBackupIntro=Tus estilos y ajustes caben en un archivo: guarda una copia, llévalo a otro ordenador o compártelo con tu equipo.
walkthroughBackupStep1=Abre la configuración con el engranaje en la parte inferior del panel, luego la pestaña Datos y «Exportar todas las configuraciones y estilos».
walkthroughBackupCoach1=Elige qué guardar, haz clic en Guardar y luego elige dónde poner el archivo.
walkthroughBackupResult1=Guarda bien este archivo: la importación, en la misma pestaña, lo recupera todo.
walkthroughProgress=Progreso de la guía
walkthroughBack=Atrás
walkthroughNext=Siguiente
walkthroughDone=hecho
walkthroughDoneStatus=hecho

