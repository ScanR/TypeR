## walkthrough
walkthroughTitle=Guide de TypeR
walkthroughCoachTitle=Guide TypeR
walkthroughPracticeTab=Entraînement TypeR
walkthroughPracticeNote=Note du traducteur : les lignes qui commencent par ## ne sont jamais collées.
walkthroughPracticeLine1=Bienvenue dans TypeR ! Chaque ligne du script va dans sa propre bulle.
walkthroughPracticeLine2=Une sélection, une insertion, et on passe à la ligne suivante.
walkthroughPracticeLine3=Pendant ce temps, loin d’ici...
walkthroughPracticeLine4=ATTENTION !
walkthroughShoutPrefix=CRI:
walkthroughIntroTitle=Bienvenue dans TypeR
walkthroughIntroText=Apprenez TypeR en vous en servant : le guide ouvre une page d’entraînement dans Photoshop et un script d’entraînement, et chaque exercice se valide dès que vous le faites.
walkthroughIntroSpot=Vous faites chaque geste vous-même : le guide met en évidence le bouton à utiliser dans le panneau. Déplacez le guide par son en-tête, ou repliez-le avec ▴.
walkthroughDoneHelp=L’aide, le ? en bas du panneau, présente chaque fonction et vos raccourcis.
walkthroughDoneText=Rouvrez ce guide à tout moment depuis l’Aide ou Paramètres > Général.
walkthroughPartBasics=Les bases
walkthroughPartMore=Pour aller plus loin
walkthroughMorePrepTitle=Page d’entraînement suivante
walkthroughMorePrepIntro=Vous connaissez les bases : voyons ce que TypeR fait pour vous. Cette partie a sa propre page d’entraînement aux bulles numérotées et son propre script, une ligne par bulle.
walkthroughMoreSmartPasteIntro=TypeR lit le vrai contour d’une bulle et y dispose le texte, même quand celui-ci est trop long pour elle.
walkthroughDoneCleanup=Fermez les deux pages d’entraînement dans Photoshop sans les enregistrer.
walkthroughCloseTabs=Fermer les onglets d’entraînement
walkthroughPrepTitle=Préparation
walkthroughPrepIntro=Le guide est pratique : TypeR ouvre une page d’entraînement avec quatre emplacements numérotés et un court script d’entraînement, une ligne par emplacement.
walkthroughPrepOpenText=Ouvrez la page d’entraînement dans Photoshop.
walkthroughPrepOpenResult=Elle s’ouvre comme un document normal : 4 emplacements numérotés, à lire de droite à gauche comme un manga. Fermez-la sans l’enregistrer à la fin.
walkthroughPrepScriptText=Chargez le script d’entraînement. Il s’ouvre dans un nouvel onglet : vos propres scripts restent intacts.
walkthroughPrepScriptResult=C’est ici que va votre traduction : collez-la dans le bloc de texte, TypeR la découpe en lignes.
walkthroughScriptTitle=Lire le script
walkthroughScriptIntro=TypeR travaille toujours sur une ligne du script, la ligne en cours : c’est le texte de la prochaine insertion.
walkthroughScriptStep1=Dans le script, cliquez sur la cible au début de la ligne 2 : elle devient la ligne en cours.
walkthroughScriptResult1=La ligne en cours est surlignée : c’est le texte de la prochaine insertion.
walkthroughScriptStep2=Passez maintenant à la ligne suivante avec la flèche ↓ sous l’aperçu, ou avec votre raccourci.
walkthroughScriptResult2=TypeR a sauté la ligne qui commence par ## : c’est une note pour vous, jamais collée. « Page 1 » en haut est un repère de page, sauté lui aussi.
walkthroughStyleTitle=Votre style de dialogue
walkthroughStyleIntro=Un style, c’est tout ce dont un calque de texte a besoin : police, taille, couleur, contour, espacements. TypeR l’applique à chaque texte que vous insérez.
walkthroughStyleStep1=Cliquez sur « Ajouter un style » sous la liste des styles.
walkthroughStyleStep1Existing=Cliquez dans la liste sur le style que vous utilisez pour les dialogues, quel que soit son nom. Aucun ne convient ? Cliquez sur « Ajouter un style » sous la liste.
walkthroughStyleCoach1=Donnez-lui le nom que vous voulez, choisissez la police et la taille de vos dialogues, puis cliquez sur Enregistrer.
walkthroughStyleResult1=Votre style est dans la liste et actif. Cliquez sur un style pour l’activer ; son crayon le modifie.
walkthroughStyleResult1Existing=« {name} » est votre style de dialogue pour ce tutoriel : chaque collage l’utilise. Cliquez sur un style pour l’activer ; son crayon le modifie.
walkthroughPasteTitle=Insérer le texte
walkthroughPasteIntro=La boucle de base : sélectionnez une bulle dans Photoshop, insérez, et TypeR passe à la ligne suivante.
walkthroughPasteStep1=Bulle 1 : dans Photoshop, prenez la baguette magique (W) et cliquez dans la grande bulle. Puis cliquez sur Insérer dans le panneau.
walkthroughPasteResult1=Un calque de texte avec votre style, centré dans la bulle : les lignes suivent sa forme ronde. TypeR est passé tout seul à la ligne 2.
walkthroughPasteStep2=Bulle 2 : même geste, et cette fois insérez avec votre raccourci.
walkthroughPasteResult2=Sélection, insertion : c’est toute la boucle. Avec le raccourci, vos mains ne quittent jamais Photoshop.
walkthroughPasteStep3=Pas de bulle à l’emplacement 3 : prenez l’outil Rectangle de sélection (M), tracez un rectangle dans le cadre en pointillés, puis insérez.
walkthroughPasteResult3=Un rectangle ou un lasso place le texte n’importe où : récitatifs, texte sur le dessin…
walkthroughShoutTitle=Un style par type de texte
walkthroughShoutIntro=Une marque au début d’une ligne du script choisit son style : la ligne est insérée avec ce style, sans la marque.
walkthroughShoutStep1=La ligne 4 commence par une marque. Créez son style à partir de votre style de dialogue : clic droit dessus dans la liste, puis « Dupliquer le style ».
walkthroughShoutStep1Edit=Cliquez maintenant sur le crayon de la copie pour la modifier.
walkthroughShoutStep1Reuse=La ligne 4 commence par une marque. Vous avez déjà un style pour les cris, « {name} » : donnez-lui cette marque au lieu d’en créer un nouveau. Cliquez sur son crayon.
walkthroughShoutCoach1=Écrivez {prefix} dans « Marques de sélection automatique de style », choisissez une police plus grasse et un autre nom si vous voulez, puis cliquez sur Enregistrer.
walkthroughShoutCoach1Reuse=Écrivez {prefix} dans « Marques de sélection automatique de style », puis cliquez sur Enregistrer.
walkthroughShoutResult1=Chaque ligne qui commence par {prefix} prend maintenant le style Cri : TypeR en fait le style en cours dès que cette ligne devient la ligne en cours.
walkthroughShoutResult1Existing=Votre style « {name} » a déjà la marque {prefix} : chaque ligne qui commence par elle prend ce style, dès que cette ligne devient la ligne en cours.
walkthroughShoutStep2=La bulle 4 est en pointes : insérez-y la ligne 4.
walkthroughShoutResult2=La marque a choisi le style Cri, et elle n’apparaît pas dans le texte. Une marque a toujours la priorité : le style que le collage intelligent choisit pour les bulles hérissées ne sert qu’aux lignes sans marque.
walkthroughShoutResult2Missed=Ce texte n’a pas pris le style Cri. Annulez-le dans Photoshop (Ctrl+Z, Cmd+Z sur Mac), vérifiez que la marque du style Cri est écrite exactement comme dans le script et qu’il est dans le même dossier que votre style de dialogue, puis insérez de nouveau la ligne 4.
walkthroughRetouchTitle=Retoucher un texte
walkthroughRetouchIntro=Un texte déjà sur la page peut être recentré ou prendre un autre style, sans le retaper.
walkthroughRetouchStep1=Dans Photoshop, décentrez le texte de la bulle 1 avec l’outil Déplacement (V). Puis sélectionnez de nouveau la bulle 1 avec la baguette magique et cliquez sur Aligner.
walkthroughRetouchResult1=Le texte est revenu au milieu de la sélection. Pratique après avoir changé la taille d’un texte.
walkthroughRetouchStep2=Sélectionnez le calque de texte de la bulle 2 dans le panneau Calques, puis cliquez sur le bouton ➜ du style Cri dans la liste.
walkthroughRetouchResult2=Le calque a pris le style Cri en gardant son texte. Ctrl+clic sur ➜ garde aussi sa taille actuelle.
walkthroughPagesTitle=Suivre vos pages
walkthroughPagesIntro=Liez les PSD d’un chapitre à votre script : à mesure que vous avancez dans les lignes, TypeR ouvre la page à laquelle elles appartiennent.
walkthroughPagesStep1=Cliquez sur l’icône de dossier (Importer des pages) en bas du panneau, puis sélectionnez les PSD d’un chapitre. Vous n’en avez pas sous la main ? Cliquez sur Passer.
walkthroughPagesResult1=TypeR a ouvert le fichier de la page 1. Chaque ligne « Page 12 » d’un script ouvre maintenant le fichier qui porte ce numéro dans son nom. Le même bouton retire le lien.
walkthroughBackupTitle=Sauvegarder vos styles
walkthroughBackupIntro=Vos styles et paramètres tiennent dans un seul fichier : gardez-en une copie, emportez-le sur un autre ordinateur ou partagez-le avec votre équipe.
walkthroughBackupStep1=Ouvrez les paramètres avec la roue dentée en bas du panneau, puis l’onglet Données et « Exporter des styles ou paramètres ».
walkthroughBackupCoach1=Choisissez ce qu’il faut sauvegarder, cliquez sur Enregistrer, puis choisissez où mettre le fichier.
walkthroughBackupResult1=Gardez ce fichier en lieu sûr : « Importer des styles ou paramètres », dans le même onglet, remet tout en place.
walkthroughProgress=Progression du guide
walkthroughBack=Retour
walkthroughNext=Suivant
walkthroughDone=Terminer
walkthroughDoneStatus=Fait

