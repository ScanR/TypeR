## What's new tour
whatsNewTimeSeconds={count} s
whatsNewTimeMinutes={count} min
whatsNewTimeMinutesSeconds={minutes} min {seconds}
whatsNewPrepTitle=Préparation
whatsNewPrepIntro=Le tour se fait en pratique : TypeR ouvre une page d’entraînement aux bulles numérotées et un script d’entraînement, une ligne par bulle.
whatsNewPrepOpenText=Ouvrez la page d’entraînement dans Photoshop.
whatsNewPrepOpenResult=Elle s’ouvre comme un document normal : 10 emplacements numérotés, un par exercice, à lire de droite à gauche comme un manga. Fermez-la sans enregistrer à la fin.
whatsNewPrepScriptText=Chargez le script d’entraînement. Il s’ouvre dans un nouvel onglet : vos scripts restent intacts.
whatsNewPrepScriptResult=Chaque ligne de ce script va dans la bulle qui porte le même numéro.
whatsNewPrepStyleText=Cliquez dans la liste sur le style que vous utilisez d’habitude pour les dialogues. Les exercices s’en servent.
whatsNewPrepStyleResult=C’est prêt. Gardez ce guide ouvert : il valide chaque exercice tout seul.
whatsNewSmartPasteTitle=Collage intelligent
whatsNewSmartPasteIntro=Jusqu’à la 2.5, le texte remplissait le rectangle de la sélection. TypeR lit maintenant le vrai contour de la bulle et y dispose le texte.
whatsNewSmartPasteStep1=Bulle 1 : dans Photoshop, prenez la baguette magique (W) et cliquez dans la grande bulle. Puis cliquez sur Insérer dans le panneau.
whatsNewSmartPasteResult1=Les lignes suivent la courbe : courtes en haut et en bas, longues au milieu, et le bloc est centré dans la bulle. La taille du style est gardée car le texte tient.
whatsNewSmartPasteStep2=Bulle 2 : même geste dans la petite bulle. Cette ligne est trop longue pour elle…
whatsNewSmartPasteResult2=…alors TypeR a réduit le texte juste assez pour qu’il tienne, jusqu’à 75 % de la taille du style au plus. Une césure n’est permise qu’en dernier recours. Les deux se règlent dans Paramètres > Insertion.
whatsNewPasteOnClickTitle=Coller au clic
whatsNewPasteOnClickIntro=Plus besoin de coller : la sélection suffit. Chaque clic à la baguette magique (ou rectangle, ou lasso) colle la ligne en cours et passe à la suivante.
whatsNewPasteOnClickStep1=Activez « Coller au clic » en bas du panneau.
whatsNewPasteOnClickResult1=C’est activé. Le mode multi-bulle se coupe : les deux ne vont pas ensemble.
whatsNewPasteOnClickStep2=À la baguette magique, cliquez dans la bulle 3, puis dans la bulle 4. Rien d’autre à faire.
whatsNewPasteOnClickResult2=Un clic, une ligne : TypeR suit vos clics dans le script.
whatsNewPasteOnClickStep3Uxp=Faites Ctrl+Z (Cmd+Z sur Mac) dans Photoshop : le texte de la bulle 4 disparaît et sa ligne redevient la ligne en cours.
whatsNewPasteOnClickStep3Legacy=Faites Ctrl+Z (Cmd+Z sur Mac) dans Photoshop, puis cliquez dans le panneau TypeR : le texte de la bulle 4 disparaît et sa ligne redevient la ligne en cours.
whatsNewPasteOnClickResult3=La bulle 4 est revenue. Coupez le mode quand vous retouchez la page, sinon chaque sélection colle une ligne.
whatsNewBubblesTitle=Toutes les bulles
whatsNewBubblesIntro=Le collage intelligent reconnaît le type de bulle et adapte le texte. Coller au clic peut rester actif : un clic par bulle.
whatsNewBubblesStep1=La bulle 6 est noire : collez-y la ligne suivante.
whatsNewBubblesResult1=Texte blanc sans contour, automatiquement. Votre style, lui, ne change pas.
whatsNewBubblesStep2=La bulle 7 est une bulle double : un seul clic ou collage dans sa partie du haut.
whatsNewBubblesResult2=Deux lignes, une par partie, en une seule étape d’historique : un Ctrl+Z annule les deux. Les triples bulles marchent pareil. Si TypeR ne met qu’une ligne dans une bulle double, recliquez dans la même bulle : il la coupe en deux et colle la ligne suivante dans l’autre partie.
whatsNewBubblesStep3=Pour les bulles de cri, TypeR utilise le style marqué « Cri » dans le dossier du style en cours. Cliquez sur le crayon du style que vous voulez pour elles, autre que votre style de dialogue. Ou créez-en un : clic droit sur votre style de dialogue, puis Dupliquer le style.
whatsNewBubblesResult3=Le style Cri ne sert qu’aux bulles détectées comme des cris. Un préfixe sur la ligne du script a toujours la priorité.
whatsNewBubblesResult3Existing=Votre style « {name} » est déjà marqué Cri : TypeR ne l’utilise que pour les bulles détectées comme des cris. Un préfixe sur la ligne du script a toujours la priorité.
whatsNewBubblesStep4=La bulle 9 est en pointes : collez-y la ligne suivante. Votre style en cours n’est pas le style Cri.
whatsNewBubblesResult4=TypeR a reconnu un cri et a utilisé le style Cri à la place du style en cours.
whatsNewBubblesResult4Missed=Le style Cri n’a pas été utilisé : vérifiez qu’il est dans le même dossier que le style en cours, puis réessayez.
whatsNewBubblesStep5=La bulle 8 a encore son lettrage d’origine. Activez Nettoyage auto, puis collez-y la ligne suivante.
whatsNewBubblesResult5=Un calque « TypeR Clean » a peint la bulle sous le texte : le lettrage d’origine est masqué, rien n’est effacé. Cela ne marche que sur les bulles unies blanches ou noires.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR propose plusieurs façons de couper les lignes d’un calque de texte selon sa bulle, de la meilleure à la moins bonne. Pratique pour retoucher une bulle déjà lettrée.
whatsNewTextShapeRStep1=Activez « TextShapeR » en bas du panneau.
whatsNewTextShapeRResult1=Les propositions apparaissent dans le panneau, sous l’aperçu. Repliez ce guide (▾) pour les voir.
whatsNewTextShapeRStep2=Dans Photoshop, sélectionnez un calque de texte dans le panneau Calques, puis cliquez sur une des formes proposées dans TypeR.
whatsNewTextShapeRResult2=Le calque prend les nouvelles coupures. Maj+clic applique et passe à la ligne suivante ; Ctrl+Z revient en arrière.
whatsNewTextShapeRStep3=Quand une suggestion vous plaît, cliquez sur l’étoile : TextShapeR apprend votre façon de couper les lignes (sans IA générative).
whatsNewTextShapeRResult3=Les propositions suivantes suivent votre style. Cette leçon ne sert qu’au tutoriel : elle est annulée quand vous quittez ce chapitre, votre propre apprentissage reste tel quel.
whatsNewWorkflowTitle=Organisez votre travail
whatsNewWorkflowIntro=Plusieurs chapitres, équipes ou projets en même temps, sans rien mélanger.
whatsNewWorkflowStep1=Onglets : cliquez sur votre onglet précédent au-dessus du script, puis revenez à l’onglet d’entraînement. Chaque onglet garde son script, sa ligne en cours et son dossier de PSD.
whatsNewWorkflowResult1=Double-cliquez sur un onglet pour le renommer. Faites-le glisser pour changer l'ordre. Le bouton + en ouvre un nouveau.
whatsNewWorkflowStep3=Presets de taille : cliquez sur le crayon de votre style en cours pour ouvrir l’éditeur de style.
whatsNewWorkflowResult3=Le raccourci « Preset de taille de texte suivant » les fait défiler sans rien ouvrir.
whatsNewFontsTitle=Vos polices
whatsNewFontsIntro=Transformez les polices de PSD existants en styles et récupérez celles qui vous manquent, sans quitter Photoshop.
whatsNewFontsStep1=FontScanR : ouvrez les paramètres avec l’engrenage en bas du panneau, puis l’onglet Données, et cliquez sur Ouvrir à côté de FontScanR.
whatsNewFontsResult1=Les polices manquantes sont cherchées sur Font FindeR, dans FontScanR et à l’import d’un dossier de styles : un clic installe une police trouvée, ou toutes à la fois.
whatsNewFontsCoachScan=FontScanR : choisissez des fichiers .psd. Il liste chaque police utilisée, avec sa taille, sa couleur et son contour, et transforme celles que vous cochez en styles. Une police que vous n’avez pas est cherchée sur Font FindeR : installez-la directement depuis la liste.
whatsNewFontsStep2=Font FindeR : ouvrez les paramètres avec l’engrenage en bas du panneau, puis l’onglet Font FindeR.
whatsNewFontsResult2=Une police installée peut servir dans un style tout de suite.
