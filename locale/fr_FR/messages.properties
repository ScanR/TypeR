whatsNewPasteOnClickStep4=Pas de bulle à l’emplacement 5 : dans Photoshop, prenez l’outil Rectangle de sélection (M) et tracez un rectangle dans le cadre en pointillés. La ligne est collée dès que vous relâchez.
whatsNewPasteOnClickResult4=Un rectangle ou un lasso place le texte n’importe où, même sur le dessin : pratique pour les cartouches et le texte hors bulle.
whatsNewBubblesStep6=Les cadres de narration marchent pareil, avec le style marqué « Narration ». Cliquez sur le crayon du style que vous voulez pour eux, ou dupliquez de nouveau votre style de dialogue.
whatsNewBubblesCoach6=Mettez Type de bulle sur Narration, choisissez la police de vos cartouches et un autre nom si vous voulez, puis cliquez sur Enregistrer.
whatsNewBubblesCoach6Reuse=Mettez Type de bulle sur Narration, puis cliquez sur Enregistrer.
whatsNewBubblesResult6=Le style Narration ne sert qu’aux cadres détectés comme de la narration.
whatsNewBubblesResult6Existing=Votre style « {name} » est déjà marqué Narration : TypeR ne l’utilise que pour les cadres détectés comme de la narration.
whatsNewBubblesStep7=Le cadre 10 est un cadre de narration : sélectionnez-le à la baguette magique et collez-y la dernière ligne.
whatsNewBubblesResult7=TypeR a reconnu un cadre de narration et a utilisé le style Narration.
whatsNewBubblesResult7Missed=Le style Narration n’a pas été utilisé : sélectionnez le cadre à la baguette magique, vérifiez que le style est dans le même dossier que le style en cours, puis réessayez.
whatsNewPasteOnClickStep3Again=Annulé ! Recliquez maintenant dans la bulle 4 à la baguette magique pour la recoller.
whatsNewNextLocked=Faites les étapes de ce chapitre pour continuer.
whatsNewChapterLocked=Terminez d’abord les chapitres précédents.
whatsNewAlreadyOn=Déjà activé : rien à faire, le guide continue.
whatsNewSkipStep=Passer
whatsNewSkipStepHint=Vous connaissez déjà : passer à l’étape suivante.
whatsNewSkippedStep=Étape passée : cliquez pour la faire quand même.
whatsNewPrepStyleCreateText=Vous n’avez pas encore de style : cliquez sur « Ajouter un style » sous la liste pour créer votre style de dialogue.
whatsNewPrepStyleCoach=Nommez le style, choisissez la police de vos dialogues, puis cliquez sur Enregistrer.
whatsNewBubblesStep3Edit=Cliquez maintenant sur le crayon de la copie pour la modifier.
whatsNewBubblesCoach3=Mettez Type de bulle sur Cri, choisissez une police qui crie et un autre nom si vous voulez, puis cliquez sur Enregistrer.
whatsNewBubblesCoach3Reuse=Mettez Type de bulle sur Cri, puis cliquez sur Enregistrer.
whatsNewWorkflowCoach3=Presets de taille : ajoutez jusqu’à trois tailles, puis cliquez sur l’une d’elles pour l’activer. Le raccourci « Preset de taille de texte suivant » passe de l’une à l’autre.
whatsNewFontsCoach=Font FindeR : cherchez des polices, prévisualisez-les avec votre propre texte et installez-en une en un clic.
whatsNewNeedsFooter=Activez « {label} » en bas du panneau.
whatsNewHiddenControl=Ce bouton est masqué dans la disposition de votre panneau. Utilisez celui-ci à la place :
whatsNewKeysLabel=Raccourci :
whatsNewCoachTitle=Guide TypeR 3.0
whatsNewCoachDone=C’est fait ! Fermez cette fenêtre pour reprendre le guide.
whatsNewIntroSpot=Vous faites chaque geste vous-même : le guide met en évidence le bouton à utiliser dans le panneau.
whatsNewPracticeLine1=Bienvenue dans TypeR 3.0 ! Ce texte suit la forme ronde de la bulle au lieu de remplir un rectangle.
whatsNewPracticeLine2=Je suis une toute petite bulle, alors ce texte doit rétrécir un peu pour tenir.
whatsNewPracticeLine3=Un clic...
whatsNewPracticeLine4=...et la ligne suivante est déjà collée !
whatsNewPracticeLine5=Dans une bulle noire, le texte passe en blanc.
whatsNewPracticeLine6=Une double bulle ?
whatsNewPracticeLine7=La suite va dans l’autre partie !
whatsNewPracticeLine8=AAAAAAH !
whatsNewPracticeLine9=Le lettrage d’origine est caché sous ce texte.
