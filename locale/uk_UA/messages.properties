whatsNewResumeText=Ви зупинилися на розділі {number} з {total}: {title}.
whatsNewResume=Продовжити
whatsNewRestart=Почати спочатку
whatsNewPracticeLine10=Тут немає бабла: досить прямокутника.
whatsNewPracticeLine11=Тим часом на іншому кінці міста...
whatsNewPasteOnClickStep4=У місці 5 бабла немає: у Photoshop візьміть інструмент «Прямокутна область» (M) і намалюйте прямокутник у пунктирній рамці. Рядок вставиться, щойно ви відпустите кнопку миші.
whatsNewPasteOnClickResult4=Прямокутник або ласо ставить текст будь-де, навіть на малюнок: зручно для підписів і тексту поза баблами.
whatsNewBubblesStep6=Рамки оповіді працюють так само — зі стилем, позначеним як «Оповідь». Натисніть на олівець стилю, який хочете для них, або знову продублюйте стиль діалогів.
whatsNewBubblesCoach6=У полі «Тип бабла» виберіть «Оповідь», підберіть шрифт для підписів і за бажання іншу назву та натисніть «Зберегти».
whatsNewBubblesCoach6Reuse=У полі «Тип бабла» виберіть «Оповідь» і натисніть «Зберегти».
whatsNewBubblesResult6=Стиль «Оповідь» використовується лише для рамок, розпізнаних як оповідь.
whatsNewBubblesResult6Existing=Ваш стиль «{name}» уже позначений як «Оповідь»: TypeR використовує його лише для рамок, розпізнаних як оповідь.
whatsNewBubblesStep7=Рамка 10 — рамка оповіді: вставте в неї останній рядок.
whatsNewBubblesResult7=TypeR розпізнав рамку оповіді й використав стиль «Оповідь».
whatsNewBubblesResult7Missed=Стиль «Оповідь» не використано: перевірте, що він у тій самій папці, що й поточний стиль, і спробуйте знову.
whatsNewPasteOnClickStep3Again=Скасовано! Тепер знову клацніть чарівною паличкою всередині бабла 4, щоб вставити його назад.
whatsNewNextLocked=Виконайте кроки цього розділу, щоб продовжити.
whatsNewChapterLocked=Спершу завершіть попередні розділи.
whatsNewAlreadyOn=Уже ввімкнено: нічого робити не треба, посібник іде далі.
whatsNewSkipStep=Пропустити
whatsNewSkipStepHint=Уже знаєте: перейти до наступного кроку.
whatsNewSkippedStep=Пропущено: натисніть, щоб усе ж виконати.
whatsNewPrepStyleCreateText=У вас ще немає стилів: натисніть «Додати стиль» під списком стилів, щоб створити стиль для діалогів.
whatsNewPrepStyleCoach=Назвіть стиль, виберіть шрифт, яким ви набираєте діалоги, потім натисніть «Зберегти».
whatsNewBubblesStep3Edit=Тепер клацніть олівець біля копії, щоб її відредагувати.
whatsNewBubblesCoach3=У полі «Тип бабла» виберіть «Крик», підберіть кричущий шрифт і за бажання іншу назву та натисніть «Зберегти».
whatsNewBubblesCoach3Reuse=У полі «Тип бабла» виберіть «Крик» і натисніть «Зберегти».
whatsNewWorkflowCoach3=Набори розміру тексту: додайте до трьох розмірів, потім клацніть один, щоб зробити його активним. Гаряча клавіша «Наступний набір розміру тексту» перемикає їх по колу.
whatsNewFontsCoach=Font FindeR: шукайте шрифти, дивіться їх на своєму тексті й установлюйте одним кліком.
whatsNewNeedsFooter=Увімкніть перемикач «{label}» унизу панелі.
whatsNewHiddenControl=Цей елемент приховано в розкладці вашої панелі. Використайте натомість цей:
whatsNewKeysLabel=Гаряча клавіша:
whatsNewCoachTitle=Посібник TypeR 3.0
whatsNewCoachDone=Готово! Закрийте це вікно, щоб продовжити посібник.
whatsNewIntroSpot=Кожну дію ви виконуєте самі: посібник підсвічує, яку кнопку на панелі натиснути.
whatsNewPracticeLine1=Ласкаво просимо до TypeR 3.0! Цей текст повторює круглу форму бабла, а не заповнює прямокутник.
whatsNewPracticeLine2=Я крихітний бабл, тож цьому текстові доведеться трохи зменшитися.
whatsNewPracticeLine3=Один клік...
whatsNewPracticeLine4=...і наступний рядок уже вставлено!
whatsNewPracticeLine5=У чорному баблі текст стає білим.
whatsNewPracticeLine6=Подвійний бабл?
whatsNewPracticeLine7=Наступний рядок іде в іншу частину!
whatsNewPracticeLine8=АААААА!
whatsNewPracticeLine9=Оригінальний летеринг сховано під цим текстом.
settingsOpenWhatsNew=Що нового в 3.0
settingsOpenWhatsNewHint=Знову переглянути огляд головних новинок 3.0.
