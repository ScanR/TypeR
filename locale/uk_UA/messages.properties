whatsNewTimeMinutesSeconds={minutes} хв {seconds} с
whatsNewPrepTitle=Підготовка
whatsNewPrepIntro=Огляд практичний: TypeR відкриває тренувальну сторінку з пронумерованими баблами й тренувальний скрипт — по рядку на бабл.
whatsNewPrepOpenText=Відкрийте тренувальну сторінку в Photoshop.
whatsNewPrepOpenResult=Вона відкриється як звичайний документ: 10 пронумерованих місць, по одному на вправу, читаються справа наліво, як манга. Наприкінці закрийте її без збереження.
whatsNewPrepScriptText=Завантажте тренувальний скрипт. Він відкриється в новій вкладці: ваші скрипти не зміняться.
whatsNewPrepScriptResult=Кожен рядок цього скрипту йде в бабл із тим самим номером.
whatsNewPrepStyleText=Клацніть у списку стилів стиль, який ви зазвичай використовуєте для діалогів. Вправи використовують його.
whatsNewPrepStyleResult=Готово. Не закривайте цей посібник: він сам перевіряє кожну вправу.
whatsNewSmartPasteTitle=Розумне вставлення
whatsNewSmartPasteIntro=До 2.5 текст заповнював прямокутник виділення. Тепер TypeR читає справжній контур бабла й розкладає текст усередині.
whatsNewSmartPasteStep1=Бабл 1: у Photoshop візьміть Чарівну паличку (W) і клацніть усередині великого бабла. Потім натисніть «Вставити» на панелі.
whatsNewSmartPasteResult1=Рядки повторюють вигин: короткі вгорі й унизу, довгі посередині, а блок відцентровано в баблі. Розмір стилю збережено, бо текст вміщується.
whatsNewSmartPasteStep2=Бабл 2: те саме в малому баблі. Цей рядок для нього задовгий…
whatsNewSmartPasteResult2=…тому TypeR зменшив текст рівно настільки, щоб він умістився, але не менше 85 % розміру стилю. Перенесення дозволене лише в крайньому разі. Обидва параметри змінюються в Налаштування > Розміщення.
whatsNewPasteOnClickTitle=Вставлення за кліком
whatsNewPasteOnClickIntro=Вставляти більше не треба: досить виділення. Кожен клік Чарівною паличкою (або прямокутник, або ласо) вставляє поточний рядок і переходить до наступного.
whatsNewPasteOnClickStep1=Увімкніть перемикач «Вставлення за кліком» унизу панелі.
whatsNewPasteOnClickResult1=Увімкнено. Режим мультибабла вимикається: вони несумісні.
whatsNewPasteOnClickStep2=Чарівною паличкою клацніть усередині бабла 3, потім усередині бабла 4. Більше нічого не треба.
whatsNewPasteOnClickResult2=Один клік — один рядок: TypeR іде за вашими кліками по скрипту.
whatsNewPasteOnClickStep3Uxp=Натисніть Ctrl+Z (Cmd+Z на Mac) у Photoshop: текст бабла 4 зникне, а його рядок знову стане поточним.
whatsNewPasteOnClickStep3Legacy=Натисніть Ctrl+Z (Cmd+Z на Mac) у Photoshop, потім клацніть у панелі TypeR: текст бабла 4 зникне, а його рядок знову стане поточним.
whatsNewPasteOnClickResult3=Бабл 4 знову на місці. Вимикайте режим, коли правите сторінку, інакше кожне виділення вставить рядок.
whatsNewBubblesTitle=Будь-які бабли
whatsNewBubblesIntro=Розумне вставлення розпізнає тип бабла й підлаштовує текст. Вставлення за кліком можна не вимикати: один клік на бабл.
whatsNewBubblesStep1=Бабл 6 чорний: вставте в нього наступний рядок.
whatsNewBubblesResult1=Білий текст без обведення — автоматично. Сам стиль не змінюється.
whatsNewBubblesStep2=Бабл 7 подвійний: один клік або одне вставлення в його верхню частину.
whatsNewBubblesResult2=Два рядки, по одному на частину, за один крок історії: одне Ctrl+Z скасовує обидва. Потрійні бабли працюють так само. Якщо TypeR вставив у подвійний бабл лише один рядок, клацніть по тому самому баблу ще раз: він розділить його й вставить наступний рядок у другу частину.
whatsNewBubblesStep3=Для баблів-криків TypeR використовує стиль, позначений як «Крик», у папці поточного стилю. Натисніть на олівець стилю, який хочете для них, окрім стилю діалогів. Або створіть новий: клацніть правою кнопкою по стилю діалогів, потім «Дублювати стиль».
whatsNewBubblesResult3=Стиль «Крик» використовується лише для баблів, розпізнаних як крик. Префікс у рядку скрипту завжди важливіший.
whatsNewBubblesResult3Existing=Ваш стиль «{name}» уже позначений як «Крик»: TypeR використовує його лише для баблів, розпізнаних як крик. Префікс у рядку скрипту завжди важливіший.
whatsNewBubblesStep4=Бабл 9 із шипами: вставте в нього наступний рядок. Ваш поточний стиль — не «Крик».
whatsNewBubblesResult4=TypeR розпізнав крик і використав стиль «Крик» замість поточного.
whatsNewBubblesResult4Missed=Стиль «Крик» не використано: перевірте, що він у тій самій папці, що й поточний стиль, і спробуйте знову.
whatsNewBubblesStep5=У баблі 8 ще є оригінальний летеринг. Увімкніть автоочищення й вставте в нього наступний рядок.
whatsNewBubblesResult5=Шар «TypeR Clean» зафарбував бабл під текстом: оригінальний летеринг приховано, нічого не стерто. Працює лише на однотонних білих або чорних баблах.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR пропонує кілька варіантів розбиття рядків текстового шару під його бабл — від найкращого до гіршого. Зручно, щоб підправити вже оформлений бабл.
whatsNewTextShapeRStep1=Увімкніть перемикач «TextShapeR» унизу панелі.
whatsNewTextShapeRResult1=Варіанти з’являються в панелі під попереднім переглядом. Згорніть цей посібник (▾), щоб їх побачити.
whatsNewTextShapeRStep2=У Photoshop виберіть текстовий шар у панелі «Шари», потім клацніть один із запропонованих варіантів у TypeR.
whatsNewTextShapeRResult2=Шар отримує нові перенесення. Shift+клацання застосовує й переходить до наступного рядка; Ctrl+Z скасовує.
whatsNewTextShapeRStep3=Коли варіант сподобається, клацніть його зірочку: TextShapeR запам’ятає, як ви розбиваєте рядки (без генеративного ШІ).
whatsNewTextShapeRResult3=Наступні варіанти будуть у вашому стилі. Цей урок лише для огляду: він скасовується, коли ви залишаєте розділ, а ваше власне навчання лишається незмінним.
whatsNewWorkflowTitle=Організуйте роботу
whatsNewWorkflowIntro=Кілька розділів, команд чи проєктів одночасно — нічого не змішується.
whatsNewWorkflowStep1=Вкладки: клацніть свою попередню вкладку над скриптом, потім поверніться на тренувальну. Кожна вкладка зберігає свій скрипт, поточний рядок і папку PSD.
whatsNewWorkflowResult1=Подвійне клацання по вкладці — перейменувати. Кнопка + відкриває нову.
whatsNewWorkflowStep3=Пресети розміру: клацніть олівець поточного стилю, щоб відкрити редактор стилю.
whatsNewWorkflowResult3=Гаряча клавіша «Наступний набір розміру тексту» перебирає їх, нічого не відкриваючи.
whatsNewFontsTitle=Ваші шрифти
whatsNewFontsIntro=Перетворюйте шрифти з готових PSD на стилі й отримуйте ті, яких бракує, не виходячи з Photoshop.
whatsNewFontsStep1=FontScanR: відкрийте налаштування шестернею внизу панелі, потім вкладку «Дані» та натисніть «Відкрити» поруч із FontScanR.
whatsNewFontsResult1=Шрифти, яких бракує, шукаються на Font FindeR — у FontScanR та під час імпорту папки стилів: один клік установлює знайдений шрифт або одразу всі.
whatsNewFontsCoachScan=FontScanR: виберіть файли .psd. Він покаже всі використані шрифти з розміром, кольором і обведенням та перетворить позначені на стилі. Шрифт, якого у вас немає, шукається на Font FindeR: установіть його прямо зі списку.
whatsNewFontsStep2=Font FindeR: відкрийте налаштування шестернею внизу панелі, потім вкладку «Перегляд шрифтів».
whatsNewFontsResult2=Установлений шрифт одразу можна використати в стилі.
whatsNewPracticePageError=Не вдалося відкрити тренувальну сторінку.
