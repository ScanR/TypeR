## walkthrough
walkthroughTitle=Посібник TypeR
walkthroughCoachTitle=Посібник TypeR
walkthroughPracticeTab=Практика TypeR
walkthroughPracticeNote=Примітка перекладача: рядки, що починаються з ##, ніколи не вставляються.
walkthroughPracticeLine1=Ласкаво просимо до TypeR! Кожен рядок скрипту йде у свій бабл.
walkthroughPracticeLine2=Одне виділення, одна вставка — і до наступного рядка.
walkthroughPracticeLine3=Тим часом, далеко звідси...
walkthroughPracticeLine4=ОБЕРЕЖНО!
walkthroughShoutPrefix=КРИК:
walkthroughIntroTitle=Ласкаво просимо до TypeR
walkthroughIntroText=Вивчайте TypeR на практиці: посібник відкриває тренувальну сторінку в Photoshop і тренувальний скрипт, і кожна вправа зараховується, щойно ви її виконаєте.
walkthroughIntroSpot=Кожну дію ви виконуєте самі: посібник підсвічує, яку кнопку на панелі натиснути. Перетягуйте посібник за заголовок або згортайте його кнопкою ▴.
walkthroughDoneTitle=Ви знаєте основи
walkthroughDoneHelp=Довідка, ? внизу панелі, описує кожну функцію і ваші поєднання клавіш.
walkthroughDoneText=Відкрийте цей посібник знову будь-коли з довідки або в Налаштування > Загальні.
walkthroughOpenWhatsNew=Далі: TypeR 3.0
walkthroughPrepTitle=Підготовка
walkthroughPrepIntro=Посібник практичний: TypeR відкриває тренувальну сторінку з чотирма пронумерованими місцями і короткий тренувальний скрипт, по рядку на місце.
walkthroughPrepOpenText=Відкрийте тренувальну сторінку в Photoshop.
walkthroughPrepOpenResult=Вона відкривається як звичайний документ: 4 пронумеровані місця, читаються справа наліво, як манґа. Наприкінці закрийте її без збереження.
walkthroughPrepScriptText=Завантажте тренувальний скрипт. Він відкриється в новій вкладці: ваші власні скрипти залишаться недоторканими.
walkthroughPrepScriptResult=Сюди йде ваш переклад: вставте його в текстовий блок, і TypeR розіб'є його на рядки.
walkthroughScriptTitle=Читання скрипту
walkthroughScriptIntro=TypeR завжди працює з одним рядком скрипту, поточним: це текст наступної вставки.
walkthroughScriptStep1=У скрипті натисніть на мішень на початку рядка 2: він стане поточним рядком.
walkthroughScriptResult1=Поточний рядок підсвічено: це текст наступної вставки.
walkthroughScriptStep2=Тепер перейдіть до наступного рядка стрілкою ↓ під превʼю або своїм поєднанням клавіш.
walkthroughScriptResult2=TypeR перестрибнув рядок, що починається з ##: це примітка для вас, вона ніколи не вставляється. «Page 1» угорі — маркер сторінки, його теж пропущено.
walkthroughStyleTitle=Ваш стиль діалогів
walkthroughStyleIntro=Стиль — це все, що потрібно текстовому шару: шрифт, розмір, колір, обведення, інтервали. TypeR застосовує його до кожного вставленого тексту.
walkthroughStyleStep1=Натисніть «Додати стиль» під списком стилів.
walkthroughStyleStep1Existing=Натисніть у списку на стиль, який ви використовуєте для діалогів, хоч як він називається. Жоден не підходить? Натисніть «Додати стиль» під списком.
walkthroughStyleCoach1=Назвіть його як хочете, виберіть шрифт і розмір ваших діалогів і натисніть «Зберегти».
walkthroughStyleResult1=Ваш стиль у списку й активний. Натисніть на стиль, щоб зробити його активним; його олівець відкриває редагування.
walkthroughStyleResult1Existing=«{name}» — ваш стиль діалогів у цьому навчанні: кожна вставка використовує його. Натисніть на стиль, щоб зробити його активним; його олівець відкриває редагування.
walkthroughPasteTitle=Вставлення тексту
walkthroughPasteIntro=Основний цикл: виділіть бабл у Photoshop, вставте, і TypeR перейде до наступного рядка.
walkthroughPasteStep1=Бабл 1: у Photoshop візьміть Чарівну паличку (W) і клацніть усередині великого бабла. Потім натисніть «Вставити» на панелі.
walkthroughPasteResult1=Текстовий шар у вашому стилі, по центру бабла: рядки повторюють його круглу форму. TypeR сам перейшов до рядка 2.
walkthroughPasteStep2=Бабл 2: та сама дія, але цього разу вставте своїм поєднанням клавіш.
walkthroughPasteResult2=Виділення, вставка — ось і весь цикл. З поєднанням клавіш ваші руки не залишають Photoshop.
walkthroughPasteStep3=У місці 3 бабла немає: візьміть інструмент «Прямокутна область» (M), намалюйте прямокутник у пунктирній рамці й вставте.
walkthroughPasteResult3=Прямокутник або ласо розміщують текст будь-де: підписи, текст поверх малюнка…
walkthroughShoutTitle=Свій стиль для кожного виду тексту
walkthroughShoutIntro=Префікс на початку рядка скрипту вибирає його стиль: рядок вставляється в цьому стилі, без префікса.
walkthroughShoutStep1=Рядок 4 починається з префікса. Створіть його стиль зі свого стилю діалогів: клацніть по ньому правою кнопкою в списку, потім «Дублювати стиль».
walkthroughShoutStep1Edit=Тепер натисніть на олівець копії, щоб її відредагувати.
walkthroughShoutStep1Reuse=Рядок 4 починається з префікса. У вас уже є стиль для криків, «{name}»: додайте йому цей префікс замість створення нового. Натисніть на його олівець.
walkthroughShoutCoach1=Впишіть {prefix} у «Префікси для автоматичного вибору стилю», за бажання виберіть жирніший шрифт та іншу назву і натисніть «Зберегти».
walkthroughShoutCoach1Reuse=Впишіть {prefix} у «Префікси для автоматичного вибору стилю» і натисніть «Зберегти».
walkthroughShoutResult1=Кожен рядок, що починається з {prefix}, тепер отримує стиль «Крик»: TypeR робить його поточним стилем, щойно цей рядок стає поточним.
walkthroughShoutResult1Existing=Ваш стиль «{name}» уже має префікс {prefix}: кожен рядок, що з нього починається, отримує цей стиль, щойно стає поточним.
walkthroughShoutStep2=Бабл 4 колючий: вставте в нього рядок 4.
walkthroughShoutResult2=Префікс вибрав стиль «Крик» і не потрапив у текст. Префікс завжди важливіший: стиль, який розумна вставка вибирає для колючих баблів, іде лише в рядки без префікса.
walkthroughShoutResult2Missed=Цей текст не отримав стиль «Крик». Скасуйте його в Photoshop (Ctrl+Z, Cmd+Z на Mac), перевірте, що префікс стилю «Крик» написано точно як у скрипті і що стиль лежить у тій самій папці, що й ваш стиль діалогів, потім знову вставте рядок 4.
walkthroughRetouchTitle=Правка тексту
walkthroughRetouchIntro=Текст, що вже є на сторінці, можна знову відцентрувати або дати йому інший стиль, не набираючи заново.
walkthroughRetouchStep1=У Photoshop зсуньте текст бабла 1 від центру інструментом «Переміщення» (V). Потім знову виділіть бабл 1 Чарівною паличкою і натисніть «Вирівняти».
walkthroughRetouchResult1=Текст повернувся в центр виділення. Зручно після зміни розміру тексту.
walkthroughRetouchStep2=Виділіть текстовий шар бабла 2 на панелі «Шари», потім натисніть кнопку ➜ стилю «Крик» у списку.
walkthroughRetouchResult2=Шар отримав стиль «Крик» і зберіг свій текст. Ctrl+клацання по ➜ зберігає ще й його поточний розмір.
walkthroughPagesTitle=Стежте за сторінками
walkthroughPagesIntro=Пов’яжіть PSD розділу зі сценарієм: коли ви рухаєтеся рядками, TypeR відкриває сторінку, до якої вони належать.
walkthroughPagesStep1=Натисніть значок папки («Імпортувати сторінки») внизу панелі та виберіть PSD розділу. Немає під рукою? Натисніть «Пропустити».
walkthroughPagesResult1=TypeR відкрив файл сторінки 1. Тепер кожен рядок «Page 12» у сценарії відкриває файл із цим номером у назві. Та сама кнопка знімає зв’язок.
