whatsNewPrepScriptBack=Повернутися на тренувальну вкладку
whatsNewPrepScriptButton=Завантажити тренувальний скрипт
whatsNewPasteButton=Вставити у виділення
whatsNewEditCurrentStyle=Змінити поточний стиль
whatsNewClickPastes=Вставлення за кліком увімкнено: досить кліку Чарівною паличкою.
whatsNewNeedsSetting=Спершу увімкніть:
whatsNewNeedsScript=Ця вправа використовує тренувальний скрипт.
whatsNewNeedsPracticeTab=Ви на іншій вкладці: клацніть вкладку «{name}» над скриптом.
whatsNewWrongLine=Цей бабл — для рядка {number}: клацніть мішень на початку цього рядка в скрипті.
