whatsNewStepTitle=Крок {current}
whatsNewChapterDone=Розділ пройдено!
whatsNewIntroTitle=Ласкаво просимо до TypeR 3.0
whatsNewIntroText=Практичний огляд у Photoshop: TypeR відкриває тренувальну сторінку й скрипт, а кожна вправа зараховується сама, щойно ви її виконаєте. Кожен крок відкриває наступний, а посібник переходить далі сам.
whatsNewTotalTime=Усього близько {time}
whatsNewDoneTitle=Усе готово
whatsNewDoneSummary=Пройдено розділів: {done} з {total}, за {minutes} хв.
whatsNewDoneCleanup=Закрийте тренувальну сторінку в Photoshop без збереження.
whatsNewCloseTab=Закрити тренувальну вкладку
whatsNewOpenBasics=Основи роботи
whatsNewDoneUxp=Ви використовуєте новий TypeR (UXP): нативно на Apple Silicon, оновлення встановлює сам.
whatsNewDoneLegacy=Це версія Legacy. Починаючи з Photoshop 2025 TypeR запропонує перейти на новий TypeR (UXP) — швидший і нативний на Apple Silicon.
whatsNewDoneText=Цей огляд можна знову відкрити в Довідці або в Налаштування > Загальні.
whatsNewTitle=Що нового в TypeR 3.0
whatsNewMinimize=Згорнути посібник (Esc)
whatsNewDragGuide=Перетягніть, щоб перемістити посібник
whatsNewContents=Зміст
