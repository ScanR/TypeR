whatsNewPasteOnClickIntro=Artık yapıştırmaya gerek yok: seçim yeterli. Sihirli Değnek ile her tıklama (ya da dikdörtgen, ya da kement) geçerli satırı yapıştırır ve sonrakine geçer.
whatsNewPasteOnClickStep1=Panelin altındaki "Tıkla yapıştır" anahtarını açın.
whatsNewPasteOnClickResult1=Açık. Çoklu balon modu kapanır: ikisi birlikte çalışmaz.
whatsNewPasteOnClickStep2=Sihirli Değnek ile balon 3'ün, sonra balon 4'ün içine tıklayın. Başka bir şey yapmanıza gerek yok.
whatsNewPasteOnClickResult2=Bir tıklama, bir satır: TypeR tıklamalarınızı senaryo boyunca izler.
whatsNewPasteOnClickStep3Uxp=Photoshop'ta Ctrl+Z'ye (Mac'te Cmd+Z) basın: balon 4'ün metni kaybolur ve satırı yeniden geçerli satır olur.
whatsNewPasteOnClickStep3Legacy=Photoshop'ta Ctrl+Z'ye (Mac'te Cmd+Z) basın, sonra TypeR paneline tıklayın: balon 4'ün metni kaybolur ve satırı yeniden geçerli satır olur.
whatsNewPasteOnClickResult3=Balon 4 geri geldi. Sayfayı rötuşlarken modu kapatın, yoksa her seçim bir satır yapıştırır.
whatsNewBubblesTitle=Her tür balon
whatsNewBubblesIntro=Akıllı yapıştırma balonun türünü tanır ve metni uyarlar. Tıkla yapıştır açık kalabilir: her balona bir tıklama.
whatsNewBubblesStep1=Balon 6 siyah: sonraki satırı içine yapıştırın.
whatsNewBubblesResult1=Konturu olmayan beyaz metin, otomatik olarak. Stilinizin kendisi değişmez.
whatsNewBubblesStep2=Balon 7 çift balon: üst kısmına tek bir tıklama ya da tek bir yapıştırma.
whatsNewBubblesResult2=Her bölüme bir tane olmak üzere iki satır, tek bir geçmiş adımında: bir Ctrl+Z ikisini de geri alır. Üçlü balonlar da aynı şekilde çalışır. TypeR çift balona tek satır koyarsa aynı balona yeniden tıklayın: balonu ikiye böler ve sonraki satırı diğer bölüme yapıştırır.
whatsNewBubblesStep3=Bağırış balonları için TypeR, geçerli stilin klasöründe balon türü "Bağırma" olarak işaretli stili kullanır. Bunlar için istediğiniz stilin kalemine tıklayın, diyalog stiliniz dışında. Ya da bir tane oluşturun: diyalog stilinize sağ tıklayın, sonra "Stili kopyala".
whatsNewBubblesResult3=Bağırış stili yalnızca bağırış olarak algılanan balonlarda kullanılır. Senaryo satırındaki bir önek her zaman önceliklidir.
whatsNewBubblesResult3Existing="{name}" stiliniz zaten Bağırma olarak işaretli: TypeR onu yalnızca bağırış olarak algılanan balonlarda kullanır. Senaryo satırındaki bir önek her zaman önceliklidir.
whatsNewBubblesStep4=Balon 9 dikenli: sonraki satırı içine yapıştırın. Geçerli stiliniz Bağırış stili değil.
whatsNewBubblesResult4=TypeR bir bağırış tanıdı ve geçerli stil yerine Bağırış stilini kullandı.
whatsNewBubblesResult4Missed=Bağırış stili kullanılmadı: geçerli stille aynı klasörde olduğunu kontrol edip yeniden deneyin.
whatsNewBubblesStep5=Balon 8'de hâlâ orijinal yazı var. Oto. temizliği açın, sonra sonraki satırı içine yapıştırın.
whatsNewBubblesResult5=Bir "TypeR Clean" katmanı balonu metnin altında boyadı: orijinal yazı gizlendi, hiçbir şey silinmedi. Yalnızca düz beyaz veya siyah balonlarda çalışır.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR, bir metin katmanının satırlarını balonuna göre bölmenin birkaç yolunu en iyiden başlayarak önerir. Zaten dizilmiş bir balonu rötuşlamak için kullanışlı.
whatsNewTextShapeRStep1=Panelin altındaki "TextShapeR" anahtarını açın.
whatsNewTextShapeRResult1=Öneriler panelde önizlemenin altında görünür. Görmek için bu kılavuzu daraltın (▾).
whatsNewTextShapeRStep2=Photoshop'ta Katmanlar panelinden bir metin katmanı seçin, sonra TypeR'da önerilen şekillerden birine tıklayın.
whatsNewTextShapeRResult2=Katman yeni satır bölmelerini alır. Shift+tıklama uygular ve sonraki satıra geçer; Ctrl+Z geri alır.
whatsNewTextShapeRStep3=Bir öneri hoşunuza gidince yıldızına tıklayın: TextShapeR satırları nasıl böldüğünüzü öğrenir (üretken yapay zekâ yok).
whatsNewTextShapeRResult3=Sonraki öneriler tarzınızı izler. Bu ders yalnızca tur içindir: bu bölümden çıktığınızda geri alınır, kendi öğrenmeniz olduğu gibi kalır.
whatsNewWorkflowTitle=İşinizi düzenleyin
whatsNewWorkflowIntro=Aynı anda birden çok bölüm, ekip veya proje, hiçbir şey karışmadan.
whatsNewWorkflowStep1=Sekmeler: senaryonun üstündeki önceki sekmenize tıklayın, sonra alıştırma sekmesine dönün. Her sekme kendi senaryosunu, geçerli satırını ve PSD klasörünü korur.
whatsNewWorkflowResult1=Yeniden adlandırmak için bir sekmeye çift tıklayın. + düğmesi yenisini açar.
whatsNewWorkflowStep3=Boyut ön ayarları: stil düzenleyiciyi açmak için geçerli stilinizin kalem simgesine tıklayın.
whatsNewWorkflowResult3="Sonraki metin boyutu ön ayarı" kısayolu hiçbir şey açmadan aralarında geçiş yapar.
