walkthroughPasteStep2=Balon 2: aynı hareket, bu kez kısayolunuzla yapıştırın.
walkthroughPasteResult2=Seçim, yapıştırma: döngünün tamamı bu. Kısayolla elleriniz Photoshop'tan hiç ayrılmaz.
walkthroughPasteStep3=3 numaralı yerde balon yok: Dikdörtgen Seçim Çerçevesi aracını (M) alın, noktalı çerçevenin içine bir dikdörtgen çizin, sonra yapıştırın.
walkthroughPasteResult3=Bir dikdörtgen veya kement metni her yere yerleştirir: anlatım kutuları, çizimin üzerindeki metinler…
walkthroughShoutTitle=Her metin türüne bir stil
walkthroughShoutIntro=Senaryo satırının başındaki bir etiket onun stilini seçer: satır, etiket olmadan o stille yapıştırılır.
walkthroughShoutStep1=4. satır bir etiketle başlıyor. Stilini diyalog stilinizden oluşturun: listede ona sağ tıklayın, sonra “Stili kopyala”.
walkthroughShoutStep1Edit=Şimdi düzenlemek için kopyanın kalemine tıklayın.
walkthroughShoutStep1Reuse=4. satır bir etiketle başlıyor. Bağırışlar için zaten bir stiliniz var, “{name}”: yenisini oluşturmak yerine ona bu etiketi verin. Kalemine tıklayın.
walkthroughShoutCoach1=“Otomatik stil seçimi için etiketler” alanına {prefix} yazın, isterseniz daha kalın bir yazı tipi ve başka bir ad seçin, sonra Kaydet'e tıklayın.
walkthroughShoutCoach1Reuse=“Otomatik stil seçimi için etiketler” alanına {prefix} yazın, sonra Kaydet'e tıklayın.
walkthroughShoutResult1={prefix} ile başlayan her satır artık Bağırış stilini alır: o satır geçerli satır olur olmaz TypeR onu geçerli stil yapar.
walkthroughShoutResult1Existing=“{name}” stilinizde {prefix} etiketi zaten var: onunla başlayan her satır, geçerli satır olur olmaz bu stili alır.
walkthroughShoutStep2=4. balon dikenli: 4. satırı içine yapıştırın.
walkthroughShoutResult2=Etiket Bağırış stilini seçti ve metne girmedi. Etiket her zaman önceliklidir: akıllı yapıştırmanın dikenli balonlar için seçtiği stil yalnızca etiketsiz satırlara gider.
walkthroughShoutResult2Missed=Bu metin Bağırış stilini almadı. Photoshop'ta geri alın (Ctrl+Z, Mac'te Cmd+Z), Bağırış stilinin etiketinin senaryodakiyle tam olarak aynı yazıldığını ve diyalog stilinizle aynı klasörde olduğunu kontrol edin, sonra 4. satırı yeniden yapıştırın.
walkthroughRetouchTitle=Bir metni düzeltmek
walkthroughRetouchIntro=Sayfada zaten bulunan bir metin, yeniden yazmadan tekrar ortalanabilir veya başka bir stil alabilir.
walkthroughRetouchStep1=Photoshop'ta 1. balonun metnini Taşıma aracıyla (V) merkezden kaydırın. Sonra 1. balonu Sihirli Değnek'le yeniden seçin ve Ortala'ya tıklayın.
walkthroughRetouchResult1=Metin seçimin ortasına geri döndü. Bir metnin boyutunu değiştirdikten sonra kullanışlıdır.
walkthroughRetouchStep2=Katmanlar panelinde 2. balonun metin katmanını seçin, sonra listede Bağırış stilinin ➜ düğmesine tıklayın.
walkthroughRetouchResult2=Katman Bağırış stilini aldı ve metnini korudu. ➜ üzerinde Ctrl+tıklama geçerli boyutunu da korur.
walkthroughBackupTitle=Stillerinizi yedekleyin
walkthroughBackupIntro=Stilleriniz ve ayarlarınız tek bir dosyaya sığar: bir kopyasını saklayın, başka bir bilgisayara taşıyın veya ekibinizle paylaşın.
