whatsNewPracticeLine10=Nenhum balão aqui: um retângulo basta.
whatsNewPracticeLine11=Enquanto isso, do outro lado da cidade...
whatsNewPasteOnClickStep4=Não há balão no ponto 5: no Photoshop, pegue o Letreiro retangular (M) e desenhe um retângulo dentro da moldura pontilhada. A linha é colada assim que você soltar.
whatsNewPasteOnClickResult4=Um retângulo ou um laço coloca o texto em qualquer lugar, até sobre o desenho: útil para recordatórios e texto fora dos balões.
whatsNewBubblesStep6=Os quadros de narração funcionam do mesmo jeito, com o estilo marcado como “Narração”. Crie um também a partir do seu estilo de diálogo: clique com o botão direito nele na lista e depois em “Duplicar estilo”.
whatsNewBubblesCoach6=Renomeie para “Narração”, defina Tipo de balão como Narração, escolha a fonte dos seus recordatórios e clique em Salvar.
whatsNewBubblesResult6=O estilo Narração só é usado nos quadros detectados como narração.
whatsNewBubblesStep7=O quadro 10 é um quadro de narração: cole a última linha nele.
whatsNewBubblesResult7=O TypeR reconheceu um quadro de narração e usou o estilo Narração.
whatsNewBubblesResult7Missed=O estilo Narração não foi usado: confira se ele está na mesma pasta que o estilo atual e tente de novo.
whatsNewAgainNarration=Você já tem um estilo “Narração” de uma vez anterior: crie um novo para fazer esta etapa.
whatsNewPasteOnClickStep3Again=Desfeito! Agora clique de novo dentro do balão 4 com a Varinha Mágica para colá-lo outra vez.
whatsNewNextLocked=Faça as etapas deste capítulo para continuar.
whatsNewChapterLocked=Termine primeiro os capítulos anteriores.
