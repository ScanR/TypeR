whatsNewDoneUxp=Você está usando o novo TypeR (UXP): nativo no Apple Silicon e capaz de instalar as próprias atualizações.
whatsNewDoneLegacy=Esta é a versão Legacy. A partir do Photoshop 2025, o TypeR oferece a troca para o novo TypeR (UXP), mais rápido e nativo no Apple Silicon.
