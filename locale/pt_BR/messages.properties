whatsNewPracticeLine10=Nenhum balão aqui: um retângulo basta.
whatsNewPracticeLine11=Enquanto isso, do outro lado da cidade...
whatsNewPasteOnClickStep4=Não há balão no ponto 5: no Photoshop, pegue o Letreiro retangular (M) e desenhe um retângulo dentro da moldura pontilhada. A linha é colada assim que você soltar.
whatsNewPasteOnClickResult4=Um retângulo ou um laço coloca o texto em qualquer lugar, até sobre o desenho: útil para recordatórios e texto fora dos balões.
whatsNewBubblesStep6=Os quadros de narração funcionam do mesmo jeito, com o estilo marcado como “Narração”. Clique no lápis do estilo que você quer para eles, ou duplique de novo o seu estilo de diálogo.
whatsNewBubblesCoach6=Defina Tipo de balão como Narração, escolha a fonte dos seus recordatórios e outro nome se quiser e clique em Salvar.
whatsNewBubblesCoach6Reuse=Defina Tipo de balão como Narração e clique em Salvar.
whatsNewBubblesResult6=O estilo Narração só é usado nos quadros detectados como narração.
whatsNewBubblesResult6Existing=Seu estilo “{name}” já está marcado como Narração: o TypeR só o usa nos quadros detectados como narração.
whatsNewBubblesStep7=O quadro 10 é um quadro de narração: selecione-o com a Varinha Mágica e cole a última linha nele.
whatsNewBubblesResult7=O TypeR reconheceu um quadro de narração e usou o estilo Narração.
whatsNewBubblesResult7Missed=O estilo Narração não foi usado: selecione o quadro com a Varinha Mágica, confira se o estilo está na mesma pasta que o estilo atual e tente de novo.
whatsNewPasteOnClickStep3Again=Desfeito! Agora clique de novo dentro do balão 4 com a Varinha Mágica para colá-lo outra vez.
whatsNewNextLocked=Faça as etapas deste capítulo para continuar.
