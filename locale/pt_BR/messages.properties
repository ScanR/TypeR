## walkthrough
walkthroughTitle=Guia do TypeR
walkthroughCoachTitle=Guia do TypeR
walkthroughPracticeTab=Treino do TypeR
walkthroughPracticeNote=Nota do tradutor: linhas que começam com ## nunca são coladas.
walkthroughPracticeLine1=Bem-vindo ao TypeR! Cada linha do roteiro vai para o seu próprio balão.
walkthroughPracticeLine2=Uma seleção, uma colagem, e para a próxima linha.
walkthroughPracticeLine3=Enquanto isso, longe daqui...
walkthroughPracticeLine4=CUIDADO!
walkthroughShoutPrefix=GRITO:
walkthroughIntroTitle=Bem-vindo ao TypeR
walkthroughIntroText=Aprenda o TypeR usando-o: o guia abre uma página de treino no Photoshop e um roteiro de treino, e cada exercício é validado assim que você o faz.
walkthroughIntroSpot=Você faz cada gesto sozinho: o guia destaca o botão a usar no painel. Arraste o guia pelo cabeçalho ou recolha-o com ▴.
walkthroughDoneHelp=A ajuda, o ? na parte de baixo do painel, apresenta cada recurso e seus atalhos.
walkthroughDoneText=Reabra este guia quando quiser pela Ajuda.
walkthroughPartBasics=O básico
walkthroughPartMore=Para ir além
walkthroughMorePrepTitle=Próxima página de treino
walkthroughMorePrepIntro=Você já conhece o básico: agora, o que o TypeR faz por você. Esta parte tem a própria página de treino com balões numerados e o próprio roteiro, uma linha por balão.
walkthroughMoreSmartPasteIntro=O TypeR lê o contorno real de um balão e distribui o texto dentro dele, mesmo quando o texto é longo demais.
walkthroughDoneCleanup=Feche as duas páginas de treino no Photoshop sem salvá-las.
walkthroughCloseTabs=Fechar as abas de treino
walkthroughPrepTitle=Preparação
walkthroughPrepIntro=O guia é prático: o TypeR abre uma página de treino com quatro pontos numerados e um roteiro de treino curto, uma linha por ponto.
walkthroughPrepOpenText=Abra a página de treino no Photoshop.
walkthroughPrepOpenResult=Ela abre como um documento normal: 4 pontos numerados, lidos da direita para a esquerda como um mangá. Feche-a sem salvar no final.
walkthroughPrepScriptText=Carregue o roteiro de treino. Ele abre em uma nova aba: seus próprios roteiros continuam intactos.
walkthroughPrepScriptResult=É aqui que vai a sua tradução: cole-a no bloco de texto, e o TypeR a divide em linhas.
walkthroughScriptTitle=Ler o roteiro
walkthroughScriptIntro=O TypeR sempre trabalha com uma linha do roteiro, a linha atual: é o texto da próxima colagem.
walkthroughScriptStep1=No roteiro, clique no alvo no início da linha 2: ela se torna a linha atual.
walkthroughScriptResult1=A linha atual fica destacada: é o texto da próxima colagem.
walkthroughScriptStep2=Agora vá para a próxima linha com a seta ↓ abaixo da pré-visualização, ou com o seu atalho.
walkthroughScriptResult2=O TypeR pulou a linha que começa com ##: é uma nota para você, nunca colada. “Page 1” no topo é um marcador de página, pulado também.
walkthroughStyleTitle=Seu estilo de diálogo
walkthroughStyleIntro=Um estilo é tudo de que uma camada de texto precisa: fonte, tamanho, cor, contorno, espaçamento. O TypeR o aplica a cada texto que você cola.
walkthroughStyleStep1=Clique em “Adicionar estilo” abaixo da lista de estilos.
walkthroughStyleStep1Existing=Clique na lista no estilo que você usa para diálogos, seja qual for o nome. Nenhum serve? Clique em “Adicionar estilo” abaixo da lista.
walkthroughStyleCoach1=Dê o nome que quiser, escolha a fonte e o tamanho dos seus diálogos e clique em Salvar.
walkthroughStyleResult1=Seu estilo está na lista e ativo. Clique em um estilo para ativá-lo; o lápis dele o edita.
walkthroughStyleResult1Existing=“{name}” é o seu estilo de diálogo neste tutorial: cada colagem o usa. Clique em um estilo para ativá-lo; o lápis dele o edita.
walkthroughPasteTitle=Colar o texto
walkthroughPasteIntro=O ciclo básico: selecione um balão no Photoshop, cole, e o TypeR passa para a próxima linha.
walkthroughPasteStep1=Balão 1: no Photoshop, pegue a Varinha Mágica (W) e clique dentro do balão grande. Depois clique em Colar no painel.
walkthroughPasteResult1=Uma camada de texto com o seu estilo, centralizada no balão: as linhas seguem a sua forma redonda. O TypeR passou sozinho para a linha 2.
walkthroughPasteStep2=Balão 2: o mesmo gesto, e desta vez cole com o seu atalho.
walkthroughPasteResult2=Seleção, colagem: esse é o ciclo inteiro. Com o atalho, suas mãos nunca saem do Photoshop.
walkthroughPasteStep3=Não há balão no ponto 3: pegue o Letreiro retangular (M), desenhe um retângulo dentro da moldura pontilhada e depois cole.
walkthroughPasteResult3=Um retângulo ou um laço coloca o texto em qualquer lugar: recordatórios, texto sobre o desenho…
walkthroughShoutTitle=Um estilo por tipo de texto
walkthroughShoutIntro=Uma tag no início de uma linha do roteiro escolhe o seu estilo: a linha é colada com esse estilo, sem a tag.
walkthroughShoutStep1=A linha 4 começa com uma tag. Crie o estilo dela a partir do seu estilo de diálogo: clique com o botão direito nele na lista e depois em “Duplicar estilo”.
walkthroughShoutStep1Edit=Agora clique no lápis da cópia para editá-la.
walkthroughShoutStep1Reuse=A linha 4 começa com uma tag. Você já tem um estilo para gritos, “{name}”: dê esta tag a ele em vez de criar um novo. Clique no lápis dele.
walkthroughShoutCoach1=Escreva {prefix} em “Tags para a escolha automática do estilo”, escolha uma fonte mais grossa e outro nome se quiser e clique em Salvar.
walkthroughShoutCoach1Reuse=Escreva {prefix} em “Tags para a escolha automática do estilo” e clique em Salvar.
walkthroughShoutResult1=Cada linha que começa com {prefix} agora recebe o estilo Grito: o TypeR o torna o estilo atual assim que essa linha vira a linha atual.
walkthroughShoutResult1Existing=Seu estilo “{name}” já tem a tag {prefix}: cada linha que começa com ela recebe esse estilo assim que vira a linha atual.
walkthroughShoutStep2=O balão 4 é pontudo: cole a linha 4 nele.
walkthroughShoutResult2=A tag escolheu o estilo Grito e ficou fora do texto. Uma tag sempre tem prioridade: o estilo que a colagem inteligente escolhe para balões espinhosos só vai para linhas sem tag.
walkthroughShoutResult2Missed=Este texto não recebeu o estilo Grito. Desfaça-o no Photoshop (Ctrl+Z, Cmd+Z no Mac), verifique se a tag do estilo Grito está escrita exatamente como no roteiro e se ele está na mesma pasta que o seu estilo de diálogo, e cole a linha 4 de novo.
walkthroughRetouchTitle=Retocar um texto
walkthroughRetouchIntro=Um texto que já está na página pode ser centralizado de novo ou receber outro estilo, sem digitá-lo de novo.
walkthroughRetouchStep1=No Photoshop, tire o texto do balão 1 do centro com a ferramenta Mover (V). Depois selecione o balão 1 de novo com a Varinha Mágica e clique em Alinhamento.
walkthroughRetouchResult1=O texto voltou para o meio da seleção. Útil depois de mudar o tamanho de um texto.
walkthroughRetouchStep2=Selecione a camada de texto do balão 2 no painel Camadas e depois clique no botão ➜ do estilo Grito na lista.
walkthroughRetouchResult2=A camada recebeu o estilo Grito e manteve o seu texto. Ctrl+clique em ➜ também mantém o tamanho atual.
walkthroughPagesTitle=Siga suas páginas
walkthroughPagesIntro=Vincule os PSDs de um capítulo ao seu script: conforme você avança pelas linhas, o TypeR abre a página a que elas pertencem.
walkthroughPagesStep1=Clique no ícone de pasta (Importar páginas) na parte inferior do painel e selecione os PSDs de um capítulo. Não tem nenhum à mão? Clique em Pular.
walkthroughPagesResult1=O TypeR abriu o arquivo da página 1. Cada linha “Page 12” de um script agora abre o arquivo com esse número no nome. O mesmo botão remove o vínculo.
walkthroughBackupTitle=Fazer backup dos seus estilos
walkthroughBackupIntro=Seus estilos e configurações cabem em um arquivo: guarde uma cópia, leve-o para outro computador ou compartilhe-o com a sua equipe.
walkthroughBackupStep1=Abra as configurações com a engrenagem na parte de baixo do painel, depois a aba Dados e “Exportar todas as configurações e estilos”.
walkthroughBackupCoach1=Escolha o que salvar, clique em Salvar e depois escolha onde colocar o arquivo.
walkthroughBackupResult1=Guarde bem este arquivo: a importação, na mesma aba, traz tudo de volta.
walkthroughProgress=Progresso do guia
walkthroughBack=Voltar
walkthroughNext=Próximo
walkthroughDone=Concluído
walkthroughDoneStatus=Concluído

