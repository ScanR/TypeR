whatsNewPrepStyleCreateText=Você ainda não tem nenhum estilo: clique em “Adicionar estilo” abaixo da lista de estilos para criar seu estilo de diálogo.
whatsNewPrepStyleCoach=Dê um nome ao estilo, escolha a fonte que você usa nos diálogos e clique em Salvar.
whatsNewBubblesStep3Edit=Agora clique no lápis da cópia para editá-la.
whatsNewBubblesCoach3=Renomeie para “Grito”, defina Tipo de balão como Grito, escolha uma fonte que grite e clique em Salvar.
whatsNewWorkflowCoach3=Predefinições de tamanho do texto: adicione até três tamanhos e clique em um para ativá-lo. O atalho “Próxima predefinição de tamanho do texto” alterna entre eles.
whatsNewFontsCoach=Font FindeR: procure fontes, veja-as com o seu próprio texto e instale uma com um clique.
