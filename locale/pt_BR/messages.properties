## What's new tour
whatsNewTimeSeconds={count} s
whatsNewTimeMinutes={count} min
whatsNewTimeMinutesSeconds={minutes} min {seconds}
whatsNewPrepTitle=Preparação
whatsNewPrepIntro=O tour é prático: o TypeR abre uma página de treino com balões numerados e um roteiro de treino, uma linha por balão.
whatsNewPrepOpenText=Abra a página de treino no Photoshop.
whatsNewPrepOpenResult=Ela abre como um documento normal: 10 pontos numerados, um por exercício, lidos da direita para a esquerda como um mangá. Feche-a sem salvar no final.
whatsNewPrepScriptText=Carregue o roteiro de treino. Ele abre em uma nova aba: seus roteiros ficam intactos.
whatsNewPrepScriptResult=Cada linha deste roteiro vai no balão com o mesmo número.
whatsNewPrepStyleText=Na lista de estilos, clique no estilo que você costuma usar nos diálogos. Os exercícios usam ele.
whatsNewPrepStyleResult=Pronto. Deixe este guia aberto: ele confere cada exercício sozinho.
whatsNewSmartPasteTitle=Colagem inteligente
whatsNewSmartPasteIntro=Até a 2.5, o texto preenchia o retângulo da seleção. Agora o TypeR lê o contorno real do balão e distribui o texto dentro dele.
whatsNewSmartPasteStep1=Balão 1: no Photoshop, pegue a Varinha Mágica (W) e clique dentro do balão grande. Depois clique em Colar no painel.
whatsNewSmartPasteResult1=As linhas seguem a curva: curtas em cima e embaixo, longas no meio, e o bloco fica centralizado no balão. O tamanho do estilo foi mantido porque o texto cabe.
whatsNewSmartPasteStep2=Balão 2: o mesmo gesto no balão pequeno. Esta linha é longa demais para ele…
whatsNewSmartPasteResult2=…então o TypeR reduziu o texto só o necessário para caber, até no máximo 70% do tamanho do estilo. Uma hifenização só entra como último recurso. Os dois se ajustam em Configurações > Comportamento.
whatsNewPasteOnClickTitle=Colar ao clicar
whatsNewPasteOnClickIntro=Não precisa mais colar: a seleção basta. Cada clique com a Varinha Mágica (ou retângulo, ou laço) cola a linha atual e passa para a próxima.
whatsNewPasteOnClickStep1=Ative “Colar ao clicar” no rodapé do painel.
whatsNewPasteOnClickResult1=Está ativo. O modo multibalão é desligado: os dois não funcionam juntos.
whatsNewPasteOnClickStep2=Com a Varinha Mágica, clique dentro do balão 3 e depois dentro do balão 4. Só isso.
whatsNewPasteOnClickResult2=Um clique, uma linha: o TypeR segue seus cliques pelo roteiro.
whatsNewPasteOnClickStep3Uxp=Aperte Ctrl+Z (Cmd+Z no Mac) no Photoshop: o texto do balão 4 some e a linha dele volta a ser a linha atual.
whatsNewPasteOnClickStep3Legacy=Aperte Ctrl+Z (Cmd+Z no Mac) no Photoshop e depois clique no painel do TypeR: o texto do balão 4 some e a linha dele volta a ser a linha atual.
whatsNewPasteOnClickResult3=O balão 4 voltou. Desligue o modo quando for retocar a página, senão cada seleção cola uma linha.
whatsNewBubblesTitle=Todo tipo de balão
whatsNewBubblesIntro=A colagem inteligente reconhece o tipo de balão e adapta o texto. Colar ao clicar pode continuar ativo: um clique por balão.
whatsNewBubblesStep1=O balão 6 é preto: cole a próxima linha nele.
whatsNewBubblesResult1=Texto branco sem contorno, automaticamente. O seu estilo não muda.
whatsNewBubblesStep2=O balão 7 é duplo: um único clique ou uma única colagem na parte de cima dele.
whatsNewBubblesResult2=Duas linhas, uma por parte, em uma única etapa do histórico: um Ctrl+Z desfaz as duas. Balões triplos funcionam igual.
whatsNewBubblesStep3=Para balões de grito, o TypeR usa o estilo marcado como “Grito” na pasta do estilo atual. Crie um a partir do seu estilo de diálogo: clique com o botão direito nele na lista e depois em “Duplicar estilo”.
whatsNewBubblesResult3=O estilo Grito só é usado nos balões detectados como grito. Um prefixo na linha do roteiro sempre tem prioridade.
whatsNewBubblesStep4=O balão 9 é espinhoso: cole a próxima linha nele. Seu estilo atual não é o estilo Grito.
whatsNewBubblesResult4=O TypeR reconheceu um grito e usou o estilo Grito no lugar do estilo atual.
whatsNewBubblesResult4Missed=O estilo Grito não foi usado: confira se ele está na mesma pasta que o estilo atual e tente de novo.
whatsNewBubblesStep5=O balão 8 ainda tem o letreiramento original. Ative a limpeza auto e cole a próxima linha nele.
whatsNewBubblesResult5=Uma camada “TypeR Clean” pintou o balão sob o texto: o letreiramento original fica escondido, nada é apagado. Só funciona em balões lisos brancos ou pretos.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=O TextShapeR sugere várias formas de quebrar as linhas de uma camada de texto conforme o balão, da melhor para a pior. Útil para retocar um balão já letreirado.
whatsNewTextShapeRStep1=Ative “TextShapeR” no rodapé do painel.
whatsNewTextShapeRResult1=As sugestões aparecem no painel, abaixo da prévia. Recolha este guia (▾) para vê-las.
whatsNewTextShapeRStep2=No Photoshop, selecione a camada de texto do balão 1 no painel Camadas e clique em uma das formas sugeridas no TypeR.
whatsNewTextShapeRResult2=A camada recebe as novas quebras. Shift+clique aplica e passa para a próxima linha; Ctrl+Z desfaz.
whatsNewTextShapeRStep3=Quando uma sugestão agradar, clique na estrela dela: o TextShapeR aprende como você quebra as linhas (sem IA generativa).
whatsNewTextShapeRResult3=As próximas sugestões seguem o seu estilo. Esta lição é só para o tour: ela é desfeita quando você sai deste capítulo, e o seu próprio aprendizado fica como estava.
whatsNewWorkflowTitle=Organize seu trabalho
whatsNewWorkflowIntro=Vários capítulos, equipes ou projetos ao mesmo tempo, sem misturar nada.
whatsNewWorkflowStep1=Abas: clique na sua aba anterior, acima do roteiro, e volte para a aba de treino. Cada aba guarda seu roteiro, sua linha atual e sua pasta de PSDs.
whatsNewWorkflowResult1=Dê um duplo clique numa aba para renomeá-la. O botão + abre uma nova.
whatsNewWorkflowStep2=Autocentralizar: clique nele no rodapé do painel. Centralizar recentraliza cada texto no balão depois de colar; Multi cuida dos balões duplos.
whatsNewWorkflowResult2=Clique de novo para voltar a Desligado se preferir posicionar os textos você mesmo.
whatsNewWorkflowStep3=Tamanhos predefinidos: clique no lápis do seu estilo atual para abrir o editor de estilos.
whatsNewWorkflowResult3=O atalho “Próxima predefinição de tamanho do texto” passa por eles sem abrir nada.
whatsNewFontsTitle=Font FindeR
whatsNewFontsIntro=Encontre a fonte certa mais rápido, sem sair do Photoshop.
whatsNewFontsStep2=Font FindeR: abra as configurações pela engrenagem no rodapé do painel e depois a aba Font FindeR.
whatsNewFontsResult2=Uma fonte instalada pode ser usada num estilo na hora.
