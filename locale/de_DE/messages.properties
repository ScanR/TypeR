whatsNewCoachDone=Fertig! Schließe dieses Fenster, um mit der Anleitung weiterzumachen.
whatsNewIntroSpot=Du machst jeden Handgriff selbst: Die Anleitung hebt den Knopf im Panel hervor, den du nutzen sollst.
whatsNewPracticeLine1=Willkommen bei TypeR 3.0! Dieser Text folgt der runden Form der Blase, statt ein Rechteck zu füllen.
