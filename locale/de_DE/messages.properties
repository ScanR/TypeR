## What's new tour
whatsNewTimeSeconds={count} s
whatsNewTimeMinutes={count} min
whatsNewTimeMinutesSeconds={minutes} min {seconds}
whatsNewPrepTitle=Vorbereitung
whatsNewPrepIntro=Die Tour ist praktisch: TypeR öffnet eine Übungsseite mit nummerierten Sprechblasen und ein Übungsskript, eine Zeile pro Blase.
whatsNewPrepOpenText=Öffne die Übungsseite in Photoshop.
whatsNewPrepOpenResult=Sie öffnet sich wie ein normales Dokument: 10 nummerierte Stellen, eine pro Übung, von rechts nach links gelesen wie ein Manga. Schließe sie am Ende ohne zu speichern.
whatsNewPrepScriptText=Lade das Übungsskript. Es öffnet sich in einem neuen Tab: deine eigenen Skripte bleiben unberührt.
whatsNewPrepScriptResult=Jede Zeile dieses Skripts gehört in die Blase mit derselben Nummer.
whatsNewPrepStyleText=Klicke in der Stilliste auf den Stil, den du sonst für Dialoge nutzt. Die Übungen verwenden ihn.
whatsNewPrepStyleResult=Bereit. Lass diese Anleitung offen: Sie prüft jede Übung selbst.
whatsNewSmartPasteTitle=Intelligentes Einfügen
whatsNewSmartPasteIntro=Bis 2.5 füllte der Text das Rechteck der Auswahl. TypeR liest jetzt die echte Kontur der Blase und setzt den Text hinein.
whatsNewSmartPasteStep1=Blase 1: Nimm in Photoshop den Zauberstab (W) und klicke in die große Blase. Klicke dann im Panel auf Einfügen.
whatsNewSmartPasteResult1=Die Zeilen folgen der Rundung: kurz oben und unten, lang in der Mitte, und der Block ist in der Blase zentriert. Die Stilgröße bleibt, weil der Text passt.
whatsNewSmartPasteStep2=Blase 2: dieselbe Geste in der kleinen Blase. Diese Zeile ist zu lang für sie…
whatsNewSmartPasteResult2=…also hat TypeR den Text gerade so weit verkleinert, dass er passt, höchstens bis 75 % der Stilgröße. Eine Silbentrennung gibt es nur als letzte Lösung. Beides lässt sich unter Einstellungen > Einsetzen ändern.
whatsNewPasteOnClickTitle=Klick-Einfügen
whatsNewPasteOnClickIntro=Kein Einfügen mehr nötig: die Auswahl reicht. Jeder Klick mit dem Zauberstab (oder Rechteck, oder Lasso) fügt die aktuelle Zeile ein und geht zur nächsten.
whatsNewPasteOnClickStep1=Schalte „Klick-Einfügen“ unten im Panel ein.
whatsNewPasteOnClickResult1=Es ist an. Der Multi-Blasen-Modus schaltet sich aus: beide gehen nicht zusammen.
whatsNewPasteOnClickStep2=Klicke mit dem Zauberstab in Blase 3, dann in Blase 4. Sonst nichts zu tun.
whatsNewPasteOnClickResult2=Ein Klick, eine Zeile: TypeR folgt deinen Klicks durch das Skript.
whatsNewPasteOnClickStep3Uxp=Drücke Strg+Z (Cmd+Z auf dem Mac) in Photoshop: Der Text von Blase 4 verschwindet und ihre Zeile wird wieder die aktuelle Zeile.
whatsNewPasteOnClickStep3Legacy=Drücke Strg+Z (Cmd+Z auf dem Mac) in Photoshop und klicke dann ins TypeR-Panel: Der Text von Blase 4 verschwindet und ihre Zeile wird wieder die aktuelle Zeile.
whatsNewPasteOnClickResult3=Blase 4 ist wieder da. Schalte den Modus aus, wenn du die Seite retuschierst, sonst fügt jede Auswahl eine Zeile ein.
whatsNewBubblesTitle=Jede Art von Sprechblase
whatsNewBubblesIntro=Das intelligente Einfügen erkennt die Art der Blase und passt den Text an. Klick-Einfügen kann an bleiben: ein Klick pro Blase.
whatsNewBubblesStep1=Blase 6 ist schwarz: Füge die nächste Zeile hinein.
whatsNewBubblesResult1=Weißer Text ohne Kontur, automatisch. Dein Stil selbst ändert sich nicht.
whatsNewBubblesStep2=Blase 7 ist eine Doppelblase: ein einziger Klick oder ein Einfügen in ihrem oberen Teil.
whatsNewBubblesResult2=Zwei Zeilen, eine pro Teil, in einem einzigen Protokollschritt: Ein Strg+Z macht beide rückgängig. Dreifachblasen funktionieren genauso. Setzt TypeR einmal nur eine Zeile in eine Doppelblase, klicken Sie erneut in dieselbe Blase: TypeR teilt sie und fügt die nächste Zeile in den anderen Teil ein.
whatsNewBubblesStep3=Für Schrei-Blasen nutzt TypeR den Stil, der im Ordner des aktuellen Stils als „Schrei“ markiert ist. Klicke auf den Stift des Stils, den du dafür willst, außer deinem Dialogstil. Oder erstelle einen: Rechtsklick auf deinen Dialogstil, dann „Style duplizieren“.
whatsNewBubblesResult3=Der Schrei-Stil wird nur für Blasen verwendet, die als Schrei erkannt werden. Ein Präfix in der Skriptzeile hat immer Vorrang.
whatsNewBubblesResult3Existing=Dein Stil „{name}“ ist schon als Schrei markiert: TypeR nutzt ihn nur für Blasen, die als Schrei erkannt werden. Ein Präfix in der Skriptzeile hat immer Vorrang.
whatsNewBubblesStep4=Blase 9 ist gezackt: Füge die nächste Zeile hinein. Dein aktueller Stil ist nicht der Schrei-Stil.
whatsNewBubblesResult4=TypeR hat einen Schrei erkannt und den Schrei-Stil statt des aktuellen Stils verwendet.
whatsNewBubblesResult4Missed=Der Schrei-Stil wurde nicht verwendet: Prüfe, ob er im selben Ordner wie der aktuelle Stil liegt, und versuche es erneut.
whatsNewBubblesStep5=Blase 8 hat noch ihr Original-Lettering. Schalte die Auto-Bereinigung ein und füge dann die nächste Zeile hinein.
whatsNewBubblesResult5=Eine Ebene „TypeR Clean“ hat die Blase unter dem Text übermalt: Das Original-Lettering ist verdeckt, nichts wird gelöscht. Das geht nur bei einfarbig weißen oder schwarzen Blasen.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR schlägt mehrere Zeilenumbrüche für eine Textebene passend zu ihrer Blase vor, vom besten an abwärts. Praktisch, um eine schon gesetzte Blase zu überarbeiten.
whatsNewTextShapeRStep1=Schalte „TextShapeR“ unten im Panel ein.
whatsNewTextShapeRResult1=Die Vorschläge erscheinen im Panel unter der Vorschau. Klappe diese Anleitung ein (▾), um sie zu sehen.
whatsNewTextShapeRStep2=Wähle in Photoshop im Ebenenbedienfeld eine Textebene und klicke dann in TypeR auf eine der vorgeschlagenen Formen.
whatsNewTextShapeRResult2=Die Ebene bekommt die neuen Umbrüche. Umschalt+Klick wendet an und geht zur nächsten Zeile; Strg+Z macht es rückgängig.
whatsNewTextShapeRStep3=Wenn dir ein Vorschlag gefällt, klicke auf seinen Stern: TextShapeR lernt, wie du Zeilen umbrichst (ohne generative KI).
whatsNewTextShapeRResult3=Die nächsten Vorschläge folgen deinem Stil. Diese Lektion gilt nur für die Tour: Sie wird rückgängig gemacht, wenn du dieses Kapitel verlässt, dein eigenes Training bleibt unverändert.
whatsNewWorkflowTitle=Organisiere deine Arbeit
whatsNewWorkflowIntro=Mehrere Kapitel, Teams oder Projekte gleichzeitig, ohne etwas zu vermischen.
whatsNewWorkflowStep1=Tabs: Klicke über dem Skript auf deinen vorherigen Tab und kehre dann zum Übungs-Tab zurück. Jeder Tab behält sein Skript, seine aktuelle Zeile und seinen PSD-Ordner.
whatsNewWorkflowResult1=Doppelklicke auf einen Tab, um ihn umzubenennen. Zieh ihn, um die Reihenfolge zu ändern. Der Knopf + öffnet einen neuen.
whatsNewWorkflowStep3=Größenvorgaben: Klicke auf den Stift deines aktuellen Stils, um den Stileditor zu öffnen.
whatsNewWorkflowResult3=Das Tastenkürzel „Nächste Textgrößen-Voreinstellung“ wechselt durch sie, ohne etwas zu öffnen.
whatsNewFontsTitle=Deine Schriften
whatsNewFontsIntro=Mache aus den Schriften vorhandener PSD-Dateien Stile und hole dir die fehlenden, ohne Photoshop zu verlassen.
whatsNewFontsStep1=FontScanR: Öffne die Einstellungen über das Zahnrad unten im Panel, dann den Tab Daten, und klicke neben FontScanR auf Öffnen.
whatsNewFontsResult1=Fehlende Schriften werden auf Font FindeR gesucht, in FontScanR und beim Import eines Stilordners: Ein Klick installiert einen Treffer oder alle auf einmal.
whatsNewFontsCoachScan=FontScanR: Wähle .psd-Dateien aus. Es listet jede verwendete Schrift mit Größe, Farbe und Kontur auf und macht aus den angehakten Stile. Eine Schrift, die du nicht hast, wird auf Font FindeR gesucht: Installiere sie direkt aus der Liste.
whatsNewFontsStep2=Font FindeR: Öffne die Einstellungen mit dem Zahnrad unten im Panel, dann den Tab Font FindeR.
whatsNewFontsResult2=Eine installierte Schrift kann sofort in einem Stil verwendet werden.
whatsNewPracticePageError=Die Übungsseite konnte nicht geöffnet werden.
whatsNewPracticeTab=TypeR 3.0 Übung
whatsNewPrepOpenAgain=Erneut öffnen
whatsNewPrepOpenButton=Übungsseite öffnen
whatsNewPrepScriptBack=Zurück zum Übungs-Tab
whatsNewPrepScriptButton=Übungsskript laden
whatsNewPasteButton=In die Auswahl einfügen
whatsNewEditCurrentStyle=Aktuellen Stil bearbeiten
whatsNewClickPastes=Klick-Einfügen ist an: Der Klick mit dem Zauberstab reicht.
whatsNewNeedsSetting=Schalte zuerst ein:
whatsNewNeedsScript=Diese Übung verwendet das Übungsskript.
whatsNewNeedsPracticeTab=Du bist in einem anderen Tab: Klicke über dem Skript auf den Tab „{name}“.
whatsNewWrongLine=Diese Blase bekommt Zeile {number}: Klicke im Skript auf das Ziel am Anfang dieser Zeile.
whatsNewChapterCount=Kapitel {current} von {total}
whatsNewStepsDone={done}/{total} erledigt
