whatsNewIntroText=Eine praktische Tour in Photoshop: TypeR öffnet eine Übungsseite und ein Skript, und jede Übung prüft sich selbst, sobald du sie machst. Jeder Schritt schaltet den nächsten frei, und die Anleitung geht von selbst weiter.
