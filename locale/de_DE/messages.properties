whatsNewPracticeLine10=Keine Blase hier: Ein Rechteck reicht.
whatsNewPracticeLine11=Unterdessen, am anderen Ende der Stadt ...
whatsNewPasteOnClickStep4=An Stelle 5 ist keine Blase: Nimm in Photoshop das Auswahlrechteck-Werkzeug (M) und zieh im gepunkteten Rahmen ein Rechteck auf. Die Zeile wird eingefügt, sobald du loslässt.
whatsNewPasteOnClickResult4=Ein Rechteck oder ein Lasso setzt den Text überallhin, sogar auf die Zeichnung: praktisch für Erzähltexte und Text außerhalb von Blasen.
whatsNewBubblesStep6=Erzählkästen funktionieren genauso, mit dem Stil, der als „Erzählung“ markiert ist. Klicke auf den Stift des Stils, den du dafür willst, oder dupliziere deinen Dialogstil noch einmal.
whatsNewBubblesCoach6=Setze den Blasentyp auf Erzählung, wähle die Schrift deiner Erzähltexte und bei Bedarf einen anderen Namen, und klicke dann auf Speichern.
whatsNewBubblesCoach6Reuse=Setze den Blasentyp auf Erzählung und klicke dann auf Speichern.
whatsNewBubblesResult6=Der Erzählung-Stil wird nur für Kästen verwendet, die als Erzählung erkannt werden.
whatsNewBubblesResult6Existing=Dein Stil „{name}“ ist schon als Erzählung markiert: TypeR nutzt ihn nur für Kästen, die als Erzählung erkannt werden.
whatsNewBubblesStep7=Kasten 10 ist ein Erzählkasten: Wähle ihn mit dem Zauberstab aus und füge die letzte Zeile hinein.
whatsNewBubblesResult7=TypeR hat einen Erzählkasten erkannt und den Erzählung-Stil verwendet.
whatsNewBubblesResult7Missed=Der Erzählung-Stil wurde nicht verwendet: Wähle den Kasten mit dem Zauberstab aus, prüfe, ob der Stil im selben Ordner wie der aktuelle Stil liegt, und versuche es erneut.
whatsNewPasteOnClickStep3Again=Rückgängig gemacht! Klicke jetzt mit dem Zauberstab noch einmal in Blase 4, um sie wieder einzufügen.
whatsNewNextLocked=Mach die Schritte dieses Kapitels, um weiterzukommen.
whatsNewChapterLocked=Schließe zuerst die vorherigen Kapitel ab.
whatsNewAlreadyOn=Schon aktiv: nichts zu tun, die Anleitung geht weiter.
whatsNewSkipStep=Überspringen
whatsNewSkipStepHint=Kennst du schon: weiter zum nächsten Schritt.
whatsNewSkippedStep=Übersprungen: klicken, um ihn doch zu machen.
whatsNewPrepStyleCreateText=Du hast noch keinen Stil: Klicke unter der Stilliste auf „Füge Style hinzu“, um deinen Dialogstil zu erstellen.
whatsNewPrepStyleCoach=Gib dem Stil einen Namen, wähle die Schrift, die du für Dialoge nutzt, und klicke dann auf Speichern.
whatsNewBubblesStep3Edit=Klicke jetzt auf den Stift der Kopie, um sie zu bearbeiten.
whatsNewBubblesCoach3=Setze den Blasentyp auf Schrei, wähle eine Schrift, die schreit, und bei Bedarf einen anderen Namen, und klicke dann auf Speichern.
whatsNewBubblesCoach3Reuse=Setze den Blasentyp auf Schrei und klicke dann auf Speichern.
whatsNewWorkflowCoach3=Textgrößen-Voreinstellungen: Füge bis zu drei Größen hinzu und klicke dann auf eine, um sie zu aktivieren. Das Tastenkürzel „Nächste Textgrößen-Voreinstellung“ wechselt durch sie.
whatsNewFontsCoach=Font FindeR: Suche Schriften, sieh sie dir mit deinem eigenen Text an und installiere eine mit einem Klick.
whatsNewNeedsFooter=Schalte „{label}“ unten im Panel ein.
whatsNewHiddenControl=Dieses Bedienelement ist in deinem Panel-Layout ausgeblendet. Nutze stattdessen dieses:
