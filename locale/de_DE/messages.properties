## walkthrough
walkthroughTitle=TypeR-Anleitung
walkthroughCoachTitle=TypeR-Anleitung
walkthroughPracticeTab=TypeR-Übung
walkthroughPracticeNote=Übersetzernotiz: Zeilen, die mit ## beginnen, werden nie eingefügt.
walkthroughPracticeLine1=Willkommen bei TypeR! Jede Zeile des Skripts kommt in ihre eigene Blase.
walkthroughPracticeLine2=Eine Auswahl, einmal einfügen, und weiter zur nächsten Zeile.
walkthroughPracticeLine3=Unterdessen, weit weg von hier...
walkthroughPracticeLine4=VORSICHT!
walkthroughShoutPrefix=SCHREI:
walkthroughIntroTitle=Willkommen bei TypeR
walkthroughIntroText=Lerne TypeR, indem du es benutzt: Die Anleitung öffnet eine Übungsseite in Photoshop und ein Übungsskript, und jede Übung wird erkannt, sobald du sie machst.
walkthroughIntroSpot=Du machst jeden Handgriff selbst: Die Anleitung hebt den Knopf im Panel hervor, den du nutzen sollst. Zieh die Anleitung an ihrer Kopfzeile, oder klapp sie mit ▴ ein.
walkthroughDoneHelp=Die Hilfe, das ? unten im Panel, zeigt jede Funktion und deine Tastenkürzel.
walkthroughDoneText=Öffne diese Anleitung jederzeit wieder über die Hilfe.
walkthroughPartBasics=Die Grundlagen
walkthroughPartMore=Weiter geht’s
walkthroughMorePrepTitle=Nächste Übungsseite
walkthroughMorePrepIntro=Du kennst die Grundlagen: Jetzt zeigen wir, was TypeR für dich erledigt. Dieser Teil hat eine eigene Übungsseite mit nummerierten Sprechblasen und ein eigenes Skript, eine Zeile pro Blase.
walkthroughMoreSmartPasteIntro=TypeR liest die echte Kontur einer Blase und setzt den Text hinein, auch wenn er eigentlich zu lang dafür ist.
walkthroughDoneCleanup=Schließe die beiden Übungsseiten in Photoshop, ohne sie zu speichern.
walkthroughCloseTabs=Übungs-Tabs schließen
walkthroughPrepTitle=Vorbereitung
walkthroughPrepIntro=Die Anleitung ist praktisch: TypeR öffnet eine Übungsseite mit vier nummerierten Stellen und ein kurzes Übungsskript, eine Zeile pro Stelle.
walkthroughPrepOpenText=Öffne die Übungsseite in Photoshop.
walkthroughPrepOpenResult=Sie öffnet sich wie ein normales Dokument: 4 nummerierte Stellen, von rechts nach links gelesen wie ein Manga. Schließ sie am Ende, ohne zu speichern.
walkthroughPrepScriptText=Lade das Übungsskript. Es öffnet sich in einem neuen Tab: Deine eigenen Skripte bleiben unberührt.
walkthroughPrepScriptResult=Hier kommt deine Übersetzung hin: Füg sie in den Textblock ein, TypeR teilt sie in Zeilen auf.
walkthroughScriptTitle=Das Skript lesen
walkthroughScriptIntro=TypeR arbeitet immer mit einer Zeile des Skripts, der aktuellen Zeile: Sie ist der Text des nächsten Einfügens.
walkthroughScriptStep1=Klicke im Skript auf das Ziel am Anfang von Zeile 2: Sie wird zur aktuellen Zeile.
walkthroughScriptResult1=Die aktuelle Zeile ist hervorgehoben: Sie ist der Text des nächsten Einfügens.
walkthroughScriptStep2=Geh jetzt mit dem Pfeil ↓ unter der Vorschau oder mit deinem Tastenkürzel zur nächsten Zeile.
walkthroughScriptResult2=TypeR hat die Zeile mit ## übersprungen: Sie ist eine Notiz für dich und wird nie eingefügt. „Page 1“ oben ist eine Seitenmarke, sie wird ebenfalls übersprungen.
walkthroughStyleTitle=Dein Dialogstil
walkthroughStyleIntro=Ein Stil ist alles, was eine Textebene braucht: Schrift, Größe, Farbe, Kontur, Abstände. TypeR wendet ihn auf jeden Text an, den du einfügst.
walkthroughStyleStep1=Klicke unter der Stilliste auf „Füge Style hinzu“.
walkthroughStyleStep1Existing=Klicke in der Liste auf den Stil, den du für Dialoge nutzt, egal wie er heißt. Keiner passt? Klicke unter der Liste auf „Füge Style hinzu“.
walkthroughStyleCoach1=Gib ihm einen Namen deiner Wahl, wähle Schrift und Größe deiner Dialoge und klicke dann auf Speichern.
walkthroughStyleResult1=Dein Stil ist in der Liste und aktiv. Klick auf einen Stil, um ihn zu aktivieren; sein Stift bearbeitet ihn.
walkthroughStyleResult1Existing=„{name}“ ist dein Dialogstil für diese Einführung: Jedes Einfügen nutzt ihn. Klick auf einen Stil, um ihn zu aktivieren; sein Stift bearbeitet ihn.
walkthroughPasteTitle=Den Text einfügen
walkthroughPasteIntro=Der Grundablauf: Wähle in Photoshop eine Blase aus, füge ein, und TypeR geht zur nächsten Zeile.
walkthroughPasteStep1=Blase 1: Nimm in Photoshop den Zauberstab (W) und klicke in die große Blase. Klicke dann im Panel auf Einfügen.
walkthroughPasteResult1=Eine Textebene mit deinem Stil, mittig in der Blase: Die Zeilen folgen ihrer runden Form. TypeR ist von selbst zu Zeile 2 gegangen.
walkthroughPasteStep2=Blase 2: derselbe Handgriff, und füge diesmal mit deinem Tastenkürzel ein.
walkthroughPasteResult2=Auswahl, einfügen: Das ist der ganze Ablauf. Mit dem Tastenkürzel verlassen deine Hände Photoshop nie.
walkthroughPasteStep3=An Stelle 3 ist keine Blase: Nimm das Auswahlrechteck-Werkzeug (M), zieh im gepunkteten Rahmen ein Rechteck auf und füge dann ein.
walkthroughPasteResult3=Ein Rechteck oder ein Lasso setzt den Text überall hin: Erzähltexte, Text auf der Zeichnung…
walkthroughShoutTitle=Ein Stil pro Textart
walkthroughShoutIntro=Ein Tag am Anfang einer Skriptzeile wählt ihren Stil: Die Zeile wird mit diesem Stil eingefügt, ohne das Tag.
walkthroughShoutStep1=Zeile 4 beginnt mit einem Tag. Erstelle ihren Stil aus deinem Dialogstil: Rechtsklick darauf in der Liste, dann „Style duplizieren“.
walkthroughShoutStep1Edit=Klicke jetzt auf den Stift der Kopie, um sie zu bearbeiten.
walkthroughShoutStep1Reuse=Zeile 4 beginnt mit einem Tag. Du hast schon einen Stil für Schreie, „{name}“: Gib ihm dieses Tag, statt einen neuen zu erstellen. Klicke auf seinen Stift.
walkthroughShoutCoach1=Schreib {prefix} in „Tags für automatische Style Auswahl“, wähle bei Bedarf eine fettere Schrift und einen anderen Namen und klicke dann auf Speichern.
walkthroughShoutCoach1Reuse=Schreib {prefix} in „Tags für automatische Style Auswahl“ und klicke dann auf Speichern.
walkthroughShoutResult1=Jede Zeile, die mit {prefix} beginnt, bekommt jetzt den Stil Schrei: TypeR macht ihn zum aktuellen Stil, sobald diese Zeile die aktuelle Zeile ist.
walkthroughShoutResult1Existing=Dein Stil „{name}“ hat schon das Tag {prefix}: Jede Zeile, die damit beginnt, bekommt diesen Stil, sobald sie die aktuelle Zeile ist.
walkthroughShoutStep2=Blase 4 ist zackig: Füge Zeile 4 in sie ein.
walkthroughShoutResult2=Das Tag hat den Stil Schrei gewählt und steht nicht im Text. Ein Tag hat immer Vorrang: Der Stil, den das smarte Einfügen für zackige Blasen wählt, gilt nur für Zeilen ohne Tag.
walkthroughShoutResult2Missed=Dieser Text hat den Stil Schrei nicht bekommen. Mach ihn in Photoshop rückgängig (Strg+Z, Cmd+Z auf dem Mac), prüfe, ob das Tag des Stils Schrei genau wie im Skript geschrieben ist und ob er im selben Ordner wie dein Dialogstil liegt, und füge Zeile 4 dann erneut ein.
walkthroughRetouchTitle=Einen Text nachbearbeiten
walkthroughRetouchIntro=Ein Text, der schon auf der Seite ist, kann neu zentriert werden oder einen anderen Stil bekommen, ohne ihn neu zu tippen.
walkthroughRetouchStep1=Verschieb in Photoshop den Text von Blase 1 mit dem Verschieben-Werkzeug (V) aus der Mitte. Wähle dann Blase 1 erneut mit dem Zauberstab aus und klicke auf Ausrichten.
walkthroughRetouchResult1=Der Text ist wieder in der Mitte der Auswahl. Praktisch, nachdem du die Größe eines Texts geändert hast.
walkthroughRetouchStep2=Wähle im Ebenen-Bedienfeld die Textebene von Blase 2 aus und klicke dann in der Liste auf den Knopf ➜ des Stils Schrei.
walkthroughRetouchResult2=Die Ebene hat den Stil Schrei bekommen und ihren Text behalten. Strg+Klick auf ➜ behält auch ihre aktuelle Größe.
walkthroughPagesTitle=Deinen Seiten folgen
walkthroughPagesIntro=Verknüpfe die PSD-Dateien eines Kapitels mit deinem Skript: Während du durch die Zeilen gehst, öffnet TypeR die passende Seite.
walkthroughPagesStep1=Klicke unten im Panel auf das Ordnersymbol (Seiten importieren) und wähle die PSD-Dateien eines Kapitels aus. Keine zur Hand? Klicke auf Überspringen.
walkthroughPagesResult1=TypeR hat die Datei von Seite 1 geöffnet. Jede Zeile „Page 12“ eines Skripts öffnet jetzt die Datei mit dieser Nummer im Namen. Derselbe Button hebt die Verknüpfung auf.
walkthroughBackupTitle=Deine Stile sichern
walkthroughBackupIntro=Deine Stile und Einstellungen passen in eine Datei: Behalte eine Kopie, nimm sie auf einen anderen Computer mit oder teile sie mit deinem Team.
walkthroughBackupStep1=Öffne die Einstellungen mit dem Zahnrad unten im Panel, dann den Tab Daten und „Alle Einstellungen und Stile exportieren“.
walkthroughBackupCoach1=Wähle, was gesichert werden soll, klicke auf Speichern und wähle dann, wo die Datei hin soll.
walkthroughBackupResult1=Bewahre diese Datei gut auf: Der Import im selben Tab stellt alles wieder her.
walkthroughProgress=Fortschritt der Anleitung
walkthroughBack=Zurück
walkthroughNext=Als nächstes
walkthroughDone=Fertig
walkthroughDoneStatus=Fertig

