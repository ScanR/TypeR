whatsNewDoneUxp=Du verwendest das neue TypeR (UXP): nativ auf Apple Silicon und installiert seine Updates selbst.
whatsNewDoneLegacy=Dies ist die Legacy-Version. Ab Photoshop 2025 bietet TypeR den Wechsel zum neuen TypeR (UXP) an, schneller und nativ auf Apple Silicon.
