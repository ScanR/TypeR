## What's new tour
whatsNewTimeSeconds={count} s
whatsNewTimeMinutes={count} min
whatsNewTimeMinutesSeconds={minutes} min {seconds}
whatsNewPrepTitle=Get ready
whatsNewPrepIntro=The tour is hands-on: TypeR opens a practice page with numbered bubbles and a practice script, one line per bubble.
whatsNewPrepOpenText=Open the practice page in Photoshop.
whatsNewPrepOpenResult=It opens as a normal document: 10 numbered spots, one per exercise, read from right to left like a manga. Close it without saving at the end.
whatsNewPrepScriptText=Load the practice script. It opens in a new tab: your own scripts stay untouched.
whatsNewPrepScriptResult=Each line of this script goes into the bubble with the same number.
whatsNewPrepStyleText=Click the style you usually use for dialogue in the style list. The exercises use it.
whatsNewPrepStyleResult=Ready. Keep this guide open: it checks each exercise by itself.
whatsNewSmartPasteTitle=Smart paste
whatsNewSmartPasteIntro=Until 2.5, the text filled the rectangle of the selection. TypeR now reads the real outline of the bubble and lays the text out inside it.
whatsNewSmartPasteStep1=Bubble 1: in Photoshop, take the Magic Wand (W) and click inside the big bubble. Then click Paste in the panel.
whatsNewSmartPasteResult1=The lines follow the curve: short at the top and bottom, long in the middle, and the block is centered in the bubble. The style size was kept because the text fits.
whatsNewSmartPasteStep2=Bubble 2: same gesture in the small bubble. This line is too long for it…
whatsNewSmartPasteResult2=…so TypeR shrank the text just enough to fit, down to 85% of the style size at most. One hyphen is allowed only as a last resort. Both can be changed in Settings > Insertion.
whatsNewPasteOnClickTitle=Paste on click
whatsNewPasteOnClickIntro=No paste needed any more: the selection is enough. Each Magic Wand click (or rectangle, or lasso) pastes the current line and moves to the next one.
whatsNewPasteOnClickStep1=Turn on “Click paste” at the bottom of the panel.
whatsNewPasteOnClickResult1=It is on. Multi-bubble mode turns off: the two do not work together.
whatsNewPasteOnClickStep2=With the Magic Wand, click inside bubble 3, then inside bubble 4. Nothing else to do.
whatsNewPasteOnClickResult2=One click, one line: TypeR follows your clicks through the script.
whatsNewPasteOnClickStep3Uxp=Press Ctrl+Z (Cmd+Z on Mac) in Photoshop: the text of bubble 4 goes away and its line becomes the current line again.
whatsNewPasteOnClickStep3Legacy=Press Ctrl+Z (Cmd+Z on Mac) in Photoshop, then click in the TypeR panel: the text of bubble 4 goes away and its line becomes the current line again.
whatsNewPasteOnClickResult3=Bubble 4 is back. Turn the mode off when you retouch the page, or every selection pastes a line.
whatsNewBubblesTitle=Every kind of bubble
whatsNewBubblesIntro=Smart paste recognizes the kind of bubble and adapts the text. Paste on click can stay on: one click per bubble.
whatsNewBubblesStep1=Bubble 6 is black: paste the next line into it.
whatsNewBubblesResult1=White text without a stroke, automatically. Your style itself does not change.
whatsNewBubblesStep2=Bubble 7 is a double bubble: one single click or paste in its upper part.
whatsNewBubblesResult2=Two lines, one per part, in a single history step: one Ctrl+Z undoes both. Triple bubbles work the same way. If TypeR ever puts a single line in a double bubble, click the same bubble again: it splits it and pastes the next line in the other part.
whatsNewBubblesStep3=For shout bubbles, TypeR uses the style marked “Shout” in the folder of the current style. Click the pencil of the style you want for them, other than your dialogue style. Or make one: right-click your dialogue style, then Duplicate.
whatsNewBubblesResult3=The Shout style is used only for bubbles detected as shouts. A prefix on the script line always wins.
whatsNewBubblesResult3Existing=Your style “{name}” is already marked Shout: TypeR uses it only for bubbles detected as shouts. A prefix on the script line always wins.
whatsNewBubblesStep4=Bubble 9 is spiky: paste the next line into it. Your current style is not the Shout style.
whatsNewBubblesResult4=TypeR recognized a shout and used the Shout style instead of the current style.
whatsNewBubblesResult4Missed=The Shout style was not used: check that it is in the same folder as the current style, then try again.
whatsNewBubblesStep5=Bubble 8 still has its original lettering. Turn on Auto clean, then paste the next line into it.
whatsNewBubblesResult5=A “TypeR Clean” layer painted the bubble under the text: the original lettering is hidden, nothing is erased. It only works on plain white or black bubbles.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR suggests several ways to break the lines of a text layer for its bubble, from the best one down. Handy to retouch a bubble already typeset.
whatsNewTextShapeRStep1=Turn on “TextShapeR” at the bottom of the panel.
whatsNewTextShapeRResult1=The suggestions appear in the panel, under the preview. You can collapse this guide (▾) to see them.
whatsNewTextShapeRStep2=In Photoshop, select a text layer in the Layers panel, then click one of the suggested shapes in TypeR.
whatsNewTextShapeRResult2=The layer gets the new line breaks. Shift+click applies and moves to the next line; Ctrl+Z goes back.
whatsNewTextShapeRStep3=When a suggestion suits you, click the star: TextShapeR learns how you break your lines (no generative AI).
whatsNewTextShapeRResult3=The next suggestions follow your style. This lesson is only for the tour: it is undone when you leave this chapter, so your own learning stays as it was.
whatsNewWorkflowTitle=Organize your work
whatsNewWorkflowIntro=Several chapters, teams or projects at once, without mixing anything.
whatsNewWorkflowStep1=Tabs: click your previous tab above the script, then come back to the practice tab. Each tab keeps its script, its current line and its PSD folder.
whatsNewWorkflowResult1=Double-click a tab to rename it. The + button opens a new one.
whatsNewWorkflowStep3=Size presets: click the pencil of your current style to open the style editor.
whatsNewWorkflowResult3=The “Next text size preset” shortcut cycles through them without opening anything.
whatsNewFontsTitle=Your fonts
whatsNewFontsIntro=Turn the fonts of existing PSD files into styles and get the ones you are missing, without leaving Photoshop.
whatsNewFontsStep1=FontScanR: open the settings with the gear at the bottom of the panel, then the Data tab, and click Open next to FontScanR.
whatsNewFontsResult1=Missing fonts are looked up on Font FindeR, in FontScanR and when you import a style folder: one click installs a match, or all of them at once.
whatsNewFontsCoachScan=FontScanR: pick .psd files. It lists every font they use, with its size, color and stroke, and turns the ones you tick into styles. A font you do not have is looked up on Font FindeR: install it right from the list.
whatsNewFontsStep2=Font FindeR: open the settings with the gear at the bottom of the panel, then the Font FindeR tab.
whatsNewFontsResult2=An installed font can be used in a style right away.
