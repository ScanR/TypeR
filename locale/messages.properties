whatsNewPrepStyleCoach=Name the style, pick the font you use for dialogue, then click Save.
whatsNewBubblesStep3Edit=Now click the pencil of the copy to edit it.
whatsNewBubblesCoach3=Set Bubble type to Shout, pick a font that shouts and another name if you like, then click Save.
whatsNewBubblesCoach3Reuse=Set Bubble type to Shout, then click Save.
whatsNewWorkflowCoach3=Size presets: add up to three sizes, then click one to make it active. The “Next text size preset” shortcut cycles through them.
