whatsNewPracticeLine11=Meanwhile, on the other side of town...
whatsNewPasteOnClickStep4=No bubble at spot 5: in Photoshop, take the Rectangular Marquee (M) and draw a rectangle in the dotted frame. The line is pasted as soon as you let go.
whatsNewPasteOnClickResult4=A rectangle or a lasso places the text anywhere, even on the art: handy for captions and text outside bubbles.
whatsNewBubblesStep6=Narration boxes work the same way, with the style marked “Narration”. Click the pencil of the style you want for them, or duplicate your dialogue style again.
whatsNewBubblesCoach6=Set Bubble type to Narration, pick the font of your captions and another name if you like, then click Save.
whatsNewBubblesCoach6Reuse=Set Bubble type to Narration, then click Save.
whatsNewBubblesResult6=The Narration style is used only for boxes detected as narration.
whatsNewBubblesResult6Existing=Your style “{name}” is already marked Narration: TypeR uses it only for boxes detected as narration.
whatsNewBubblesStep7=Box 10 is a narration box: paste the last line into it.
whatsNewBubblesResult7=TypeR recognized a narration box and used the Narration style.
whatsNewBubblesResult7Missed=The Narration style was not used: check that it is in the same folder as the current style, then try again.
whatsNewPasteOnClickStep3Again=Undone! Now click inside bubble 4 again with the Magic Wand to paste it back.
