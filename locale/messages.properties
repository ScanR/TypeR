## walkthrough
walkthroughTitle=TypeR walkthrough
walkthroughCoachTitle=TypeR guide
walkthroughPracticeTab=TypeR practice
walkthroughPracticeNote=Translator note: lines starting with ## are never pasted.
walkthroughPracticeLine1=Welcome to TypeR! Each line of the script goes into its own bubble.
walkthroughPracticeLine2=One selection, one paste, and on to the next line.
walkthroughPracticeLine3=Meanwhile, far away from here...
walkthroughPracticeLine4=WATCH OUT!
walkthroughShoutPrefix=SHOUT:
walkthroughIntroTitle=Welcome to TypeR
walkthroughIntroText=Learn TypeR by using it: the guide opens a practice page in Photoshop and a practice script, and each exercise checks itself as soon as you do it.
walkthroughIntroSpot=You do every gesture yourself: the guide highlights the button to use in the panel. Drag the guide by its header, or fold it away with ▴.
walkthroughDoneHelp=Help, the ? at the bottom of the panel, lists every feature and your shortcuts.
walkthroughDoneText=Reopen this guide at any time from Help or Settings > General.
walkthroughPartBasics=The basics
walkthroughPartMore=Going further
walkthroughMorePrepTitle=Next practice page
walkthroughMorePrepIntro=You know the basics: now, what TypeR does for you. This part has its own practice page with numbered bubbles and its own script, one line per bubble.
walkthroughMoreSmartPasteIntro=TypeR reads the real outline of a bubble and lays the text out inside it, even when the text is too long for it.
walkthroughDoneCleanup=Close the two practice pages in Photoshop without saving them.
walkthroughCloseTabs=Close the practice tabs
walkthroughPrepTitle=Get ready
walkthroughPrepIntro=The walkthrough is hands-on: TypeR opens a practice page with four numbered spots and a short practice script, one line per spot.
walkthroughPrepOpenText=Open the practice page in Photoshop.
walkthroughPrepOpenResult=It opens as a normal document: 4 numbered spots, read from right to left like a manga. Close it without saving at the end.
walkthroughPrepScriptText=Load the practice script. It opens in a new tab: your own scripts stay untouched.
walkthroughPrepScriptResult=This is where your translation goes: paste it in the text block, TypeR splits it into lines.
walkthroughScriptTitle=Read the script
walkthroughScriptIntro=TypeR always works on one line of the script, the current line: it is the text of the next paste.
walkthroughScriptStep1=In the script, click the target at the start of line 2: it becomes the current line.
walkthroughScriptResult1=The current line is highlighted: it is the text of the next paste.
walkthroughScriptStep2=Now go to the next line with the ↓ arrow under the preview, or with your shortcut.
walkthroughScriptResult2=TypeR jumped over the line starting with ##: it is a note for you, never pasted. “Page 1” at the top is a page marker, skipped as well.
walkthroughStyleTitle=Your dialogue style
walkthroughStyleIntro=A style is everything a text layer needs: font, size, color, stroke, spacing. TypeR applies it to every text you paste.
walkthroughStyleStep1=Click “Add style” under the style list.
walkthroughStyleStep1Existing=Click the style you use for dialogue in the list, whatever its name. None fits? Click “Add style” under the list.
walkthroughStyleCoach1=Give it the name you like, pick the font and size you use for dialogue, then click Save.
walkthroughStyleResult1=Your style is in the list and active. Click a style to make it active; its pencil edits it.
walkthroughStyleResult1Existing=“{name}” is your dialogue style for the walkthrough: every paste uses it. Click a style to make it active; its pencil edits it.
walkthroughPasteTitle=Paste the text
walkthroughPasteIntro=The core loop: select a bubble in Photoshop, paste, and TypeR moves on to the next line.
walkthroughPasteStep1=Bubble 1: in Photoshop, take the Magic Wand (W) and click inside the big bubble. Then click Paste in the panel.
walkthroughPasteResult1=A text layer with your style, centered in the bubble: the lines follow its round shape. TypeR moved on to line 2 by itself.
walkthroughPasteStep2=Bubble 2: same gesture, and this time paste with your shortcut.
walkthroughPasteResult2=Selection, paste: that is the whole loop. With the shortcut, your hands never leave Photoshop.
walkthroughPasteStep3=No bubble at spot 3: take the Rectangular Marquee (M), draw a rectangle in the dotted frame, then paste.
walkthroughPasteResult3=A rectangle or a lasso places the text anywhere: captions, text on the art…
walkthroughShoutTitle=One style per kind of text
walkthroughShoutIntro=A tag at the start of a script line picks its style: the line is pasted with that style, without the tag.
walkthroughShoutStep1=Line 4 starts with a tag. Make its style from your dialogue style: right-click it in the list, then “Duplicate style”.
walkthroughShoutStep1Edit=Now click the pencil of the copy to edit it.
walkthroughShoutStep1Reuse=Line 4 starts with a tag. You already have a style for shouts, “{name}”: give it this tag instead of making a new one. Click its pencil.
walkthroughShoutCoach1=Write {prefix} in “Tags for automatic style choosing”, pick a bolder font and another name if you like, then click Save.
walkthroughShoutCoach1Reuse=Write {prefix} in “Tags for automatic style choosing”, then click Save.
walkthroughShoutResult1=Every line starting with {prefix} now gets the Shout style: TypeR makes it the current style as soon as that line is the current line.
walkthroughShoutResult1Existing=Your style “{name}” already has the {prefix} tag: every line starting with it gets that style, as soon as that line is the current line.
walkthroughShoutStep2=Bubble 4 is spiky: paste line 4 into it.
walkthroughShoutResult2=The tag picked the Shout style, and it was left out of the text. A tag always wins: the style smart paste picks for spiky bubbles only goes to lines without one.
walkthroughShoutResult2Missed=This text did not get the Shout style. Undo it in Photoshop (Ctrl+Z, Cmd+Z on Mac), check that the tag of the Shout style is written exactly as in the script and that it is in the same folder as your dialogue style, then paste line 4 again.
walkthroughRetouchTitle=Retouch a text
walkthroughRetouchIntro=A text already on the page can be centered again or take another style, without typing it again.
walkthroughRetouchStep1=In Photoshop, move the text of bubble 1 off center with the Move tool (V). Then select bubble 1 again with the Magic Wand and click Align.
walkthroughRetouchResult1=The text is back in the middle of the selection. Handy after resizing a text.
walkthroughRetouchStep2=Select the text layer of bubble 2 in the Layers panel, then click the ➜ button of the Shout style in the list.
walkthroughRetouchResult2=The layer took the Shout style and kept its text. Ctrl+click on ➜ also keeps its current size.
walkthroughPagesTitle=Follow your pages
walkthroughPagesIntro=Link the PSD files of a chapter to your script: as you go through the lines, TypeR opens the page they belong to.
walkthroughPagesStep1=Click the folder icon (Import pages) at the bottom of the panel, then select the PSD files of a chapter. None at hand? Click Skip.
walkthroughPagesResult1=TypeR opened the file of page 1. Each “Page 12” line of a script now opens the file with that number in its name. The same button unlinks the files.
walkthroughBackupTitle=Back up your styles
walkthroughBackupIntro=Your styles and settings fit in one file: keep a copy, move it to another computer or share it with your team.
walkthroughBackupStep1=Open the settings with the gear at the bottom of the panel, then the Data tab and “Export styles or settings”.
walkthroughBackupCoach1=Pick what to save, click Save, then choose where to put the file.
walkthroughBackupResult1=Keep this file safe: “Import styles or settings”, in the same tab, brings everything back.
walkthroughProgress=Walkthrough progress
walkthroughBack=Back
walkthroughNext=Next
walkthroughDone=Done
walkthroughDoneStatus=Done

