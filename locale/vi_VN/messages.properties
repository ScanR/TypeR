whatsNewDoneUxp=Bạn đang dùng TypeR mới (UXP): chạy gốc trên Apple Silicon và tự cài đặt bản cập nhật.
whatsNewDoneLegacy=Đây là phiên bản Legacy. Từ Photoshop 2025, TypeR sẽ đề nghị chuyển sang TypeR mới (UXP), nhanh hơn và chạy gốc trên Apple Silicon.
