walkthroughPrepTitle=Chuẩn bị
walkthroughPrepIntro=Hướng dẫn mang tính thực hành: TypeR mở một trang luyện tập có bốn vị trí đánh số và một kịch bản luyện tập ngắn, mỗi vị trí một dòng.
walkthroughPrepOpenText=Mở trang luyện tập trong Photoshop.
walkthroughPrepOpenResult=Nó mở ra như một tài liệu bình thường: 4 vị trí đánh số, đọc từ phải sang trái như manga. Cuối cùng hãy đóng nó mà không lưu.
walkthroughPrepScriptText=Tải kịch bản luyện tập. Nó mở trong một tab mới: các kịch bản của bạn vẫn nguyên vẹn.
walkthroughPrepScriptResult=Bản dịch của bạn đặt ở đây: dán vào khối văn bản, TypeR sẽ chia nó thành từng dòng.
walkthroughScriptTitle=Đọc kịch bản
walkthroughScriptIntro=TypeR luôn làm việc với một dòng của kịch bản, dòng hiện tại: đó là văn bản của lần dán tiếp theo.
walkthroughScriptStep1=Trong kịch bản, nhấp vào biểu tượng mục tiêu ở đầu dòng 2: nó trở thành dòng hiện tại.
walkthroughScriptResult1=Dòng hiện tại được làm nổi bật: đó là văn bản của lần dán tiếp theo.
walkthroughScriptStep2=Bây giờ sang dòng tiếp theo bằng mũi tên ↓ dưới bản xem trước, hoặc bằng phím tắt của bạn.
walkthroughScriptResult2=TypeR đã nhảy qua dòng bắt đầu bằng ##: đó là ghi chú cho bạn, không bao giờ được dán. “Page 1” ở trên cùng là dấu trang, cũng được bỏ qua.
walkthroughStyleTitle=Kiểu thoại của bạn
walkthroughStyleIntro=Một kiểu là mọi thứ một lớp văn bản cần: phông chữ, cỡ chữ, màu, viền, khoảng cách. TypeR áp dụng nó cho mọi văn bản bạn dán.
walkthroughStyleStep1=Nhấp “Thêm kiểu cách” dưới danh sách kiểu.
walkthroughStyleStep1Existing=Nhấp vào kiểu bạn dùng cho thoại trong danh sách, tên gì cũng được. Không kiểu nào hợp? Nhấp “Thêm kiểu cách” dưới danh sách.
walkthroughStyleCoach1=Đặt tên tùy ý, chọn phông chữ và cỡ chữ bạn dùng cho thoại, rồi nhấp Lưu.
walkthroughStyleResult1=Kiểu của bạn đã ở trong danh sách và đang hoạt động. Nhấp vào một kiểu để kích hoạt; cây bút của nó dùng để sửa.
walkthroughStyleResult1Existing=“{name}” là kiểu thoại của bạn trong hướng dẫn này: mỗi lần dán đều dùng nó. Nhấp vào một kiểu để kích hoạt; cây bút của nó dùng để sửa.
walkthroughPasteTitle=Dán văn bản
walkthroughPasteIntro=Vòng lặp cơ bản: chọn một bóng thoại trong Photoshop, dán, và TypeR chuyển sang dòng tiếp theo.
walkthroughPasteStep1=Bóng 1: trong Photoshop, cầm Magic Wand (W) và nhấp vào trong bóng lớn. Sau đó nhấp Dán trong bảng.
walkthroughPasteResult1=Một lớp văn bản với kiểu của bạn, căn giữa trong bóng: các dòng theo hình tròn của nó. TypeR đã tự chuyển sang dòng 2.
walkthroughPasteStep2=Bóng 2: cùng thao tác, lần này dán bằng phím tắt của bạn.
walkthroughPasteResult2=Chọn, dán: đó là cả vòng lặp. Với phím tắt, tay bạn không bao giờ rời Photoshop.
walkthroughPasteStep3=Vị trí 3 không có bóng thoại: chọn công cụ Rectangular Marquee (M), vẽ một hình chữ nhật trong khung chấm, rồi dán.
walkthroughPasteResult3=Một hình chữ nhật hoặc lasso đặt văn bản ở bất cứ đâu: lời dẫn, chữ trên hình vẽ…
walkthroughShoutTitle=Mỗi loại văn bản một kiểu
walkthroughShoutIntro=Một ký hiệu ở đầu dòng kịch bản chọn kiểu của nó: dòng được dán với kiểu đó, không kèm ký hiệu.
walkthroughShoutStep1=Dòng 4 bắt đầu bằng một ký hiệu. Tạo kiểu của nó từ kiểu thoại của bạn: nhấp chuột phải vào nó trong danh sách, rồi chọn “Sao chép kiểu cách”.
walkthroughShoutStep1Edit=Bây giờ nhấp vào cây bút của bản sao để sửa nó.
walkthroughShoutStep1Reuse=Dòng 4 bắt đầu bằng một ký hiệu. Bạn đã có kiểu cho tiếng hét, “{name}”: hãy gán ký hiệu này cho nó thay vì tạo kiểu mới. Nhấp vào cây bút của nó.
walkthroughShoutCoach1=Ghi {prefix} vào “Ký hiệu chọn kiểu cách tự động”, chọn phông chữ đậm hơn và tên khác nếu muốn, rồi nhấp Lưu.
walkthroughShoutCoach1Reuse=Ghi {prefix} vào “Ký hiệu chọn kiểu cách tự động”, rồi nhấp Lưu.
walkthroughShoutResult1=Mọi dòng bắt đầu bằng {prefix} giờ nhận kiểu Hét: TypeR đặt nó làm kiểu hiện tại ngay khi dòng đó trở thành dòng hiện tại.
walkthroughShoutResult1Existing=Kiểu “{name}” của bạn đã có ký hiệu {prefix}: mọi dòng bắt đầu bằng nó nhận kiểu này ngay khi dòng đó trở thành dòng hiện tại.
walkthroughShoutStep2=Bóng 4 có gai: dán dòng 4 vào đó.
walkthroughShoutResult2=Ký hiệu đã chọn kiểu Hét, và nó không xuất hiện trong văn bản. Ký hiệu luôn được ưu tiên: kiểu mà dán thông minh chọn cho bóng gai chỉ dùng cho các dòng không có ký hiệu.
