whatsNewIntroTitle=Chào mừng đến với TypeR 3.0
whatsNewIntroText=Phần giới thiệu thực hành trong Photoshop: TypeR mở một trang luyện tập và một kịch bản, mỗi bài tập tự được xác nhận ngay khi bạn làm xong. Mỗi bước mở khóa bước tiếp theo, và hướng dẫn tự chuyển tiếp.
