whatsNewPasteOnClickStep2=Dùng Magic Wand nhấp vào trong bóng 3, rồi trong bóng 4. Không cần làm gì thêm.
whatsNewPasteOnClickResult2=Một cú nhấp, một dòng: TypeR đi theo các cú nhấp của bạn trong kịch bản.
whatsNewPasteOnClickStep3Uxp=Nhấn Ctrl+Z (Cmd+Z trên Mac) trong Photoshop: chữ của bóng 4 biến mất và dòng của nó lại thành dòng hiện tại.
whatsNewPasteOnClickStep3Legacy=Nhấn Ctrl+Z (Cmd+Z trên Mac) trong Photoshop, rồi nhấp vào bảng TypeR: chữ của bóng 4 biến mất và dòng của nó lại thành dòng hiện tại.
whatsNewPasteOnClickResult3=Bóng 4 đã trở lại. Hãy tắt chế độ khi chỉnh sửa trang, nếu không mỗi vùng chọn sẽ dán một dòng.
whatsNewBubblesTitle=Mọi loại bóng thoại
whatsNewBubblesIntro=Dán thông minh nhận ra loại bóng thoại và điều chỉnh chữ. Dán khi nhấp có thể vẫn bật: mỗi bóng một cú nhấp.
whatsNewBubblesStep1=Bóng 6 màu đen: dán dòng tiếp theo vào đó.
whatsNewBubblesResult1=Chữ trắng không viền, tự động. Bản thân kiểu của bạn không đổi.
whatsNewBubblesStep2=Bóng 7 là bóng đôi: chỉ một cú nhấp hoặc một lần dán vào phần trên của nó.
whatsNewBubblesResult2=Hai dòng, mỗi phần một dòng, trong một bước lịch sử duy nhất: một lần Ctrl+Z hoàn tác cả hai. Bóng ba cũng tương tự. Nếu TypeR chỉ đặt một dòng vào bóng đôi, hãy nhấp lại vào chính bóng đó: TypeR sẽ chia đôi và dán dòng tiếp theo vào phần còn lại.
whatsNewBubblesStep3=Với bóng hét, TypeR dùng kiểu được đánh dấu "Hét" trong thư mục của kiểu hiện tại. Nhấp vào cây bút của kiểu bạn muốn dùng cho chúng, khác với kiểu thoại của bạn. Hoặc tạo một kiểu: nhấp chuột phải vào kiểu thoại của bạn, rồi chọn "Sao chép kiểu cách".
whatsNewBubblesResult3=Kiểu Hét chỉ dùng cho các bóng được nhận ra là tiếng hét. Tiền tố trên dòng kịch bản luôn được ưu tiên.
whatsNewBubblesResult3Existing=Kiểu "{name}" của bạn đã được đánh dấu Hét: TypeR chỉ dùng nó cho các bóng được nhận ra là tiếng hét. Tiền tố trên dòng kịch bản luôn được ưu tiên.
whatsNewBubblesStep4=Bóng 9 có gai: dán dòng tiếp theo vào đó. Kiểu hiện tại của bạn không phải kiểu Hét.
whatsNewBubblesResult4=TypeR đã nhận ra tiếng hét và dùng kiểu Hét thay cho kiểu hiện tại.
whatsNewBubblesResult4Missed=Kiểu Hét chưa được dùng: kiểm tra rằng nó nằm cùng thư mục với kiểu hiện tại rồi thử lại.
whatsNewBubblesStep5=Bóng 8 vẫn còn chữ gốc. Bật Tự làm sạch, rồi dán dòng tiếp theo vào đó.
whatsNewBubblesResult5=Một lớp "TypeR Clean" đã tô bóng dưới chữ: chữ gốc bị che, không có gì bị xóa. Chỉ hoạt động với bóng trắng hoặc đen trơn.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR gợi ý nhiều cách ngắt dòng cho một lớp văn bản theo bóng thoại của nó, từ tốt nhất trở xuống. Tiện để chỉnh lại một bóng đã dịch.
whatsNewTextShapeRStep1=Bật "TextShapeR" ở cuối bảng.
whatsNewTextShapeRResult1=Các gợi ý hiện trong bảng, dưới phần xem trước. Thu gọn hướng dẫn này (▾) để thấy chúng.
whatsNewTextShapeRStep2=Trong Photoshop, chọn một lớp văn bản trong bảng Layers, rồi nhấp một trong các hình dạng được gợi ý trong TypeR.
whatsNewTextShapeRResult2=Lớp nhận cách ngắt dòng mới. Shift+nhấp áp dụng và chuyển sang dòng tiếp theo; Ctrl+Z để quay lại.
whatsNewTextShapeRStep3=Khi thích một gợi ý, hãy nhấp vào ngôi sao của nó: TextShapeR học cách bạn ngắt dòng (không dùng AI tạo sinh).
whatsNewTextShapeRResult3=Các gợi ý sau sẽ theo phong cách của bạn. Bài học này chỉ dành cho phần hướng dẫn: nó sẽ bị hủy khi bạn rời chương này, dữ liệu học của bạn vẫn giữ nguyên.
whatsNewWorkflowTitle=Sắp xếp công việc
whatsNewWorkflowIntro=Nhiều chương, nhóm hoặc dự án cùng lúc mà không lẫn lộn.
whatsNewWorkflowStep1=Tab: nhấp vào tab trước đó của bạn phía trên kịch bản, rồi quay lại tab luyện tập. Mỗi tab giữ kịch bản, dòng hiện tại và thư mục PSD riêng.
whatsNewWorkflowResult1=Nhấp đúp vào tab để đổi tên. Kéo tab để đổi thứ tự. Nút + mở tab mới.
whatsNewWorkflowStep3=Cỡ chữ đặt sẵn: nhấp vào bút chì của kiểu hiện tại để mở trình sửa kiểu.
whatsNewWorkflowResult3=Phím tắt "Cỡ chữ đặt trước tiếp theo" chuyển qua chúng mà không cần mở gì.
whatsNewFontsTitle=Phông chữ của bạn
whatsNewFontsIntro=Biến phông chữ trong các PSD có sẵn thành style và lấy những phông còn thiếu, ngay trong Photoshop.
whatsNewFontsStep1=FontScanR: mở cài đặt bằng biểu tượng bánh răng ở cuối bảng, rồi mở tab Dữ liệu và nhấp Mở bên cạnh FontScanR.
whatsNewFontsResult1=Phông còn thiếu được tìm trên Font FindeR, trong FontScanR và khi nhập thư mục style: một cú nhấp để cài phông tìm thấy, hoặc tất cả cùng lúc.
whatsNewFontsCoachScan=FontScanR: chọn các tệp .psd. Công cụ liệt kê mọi phông được dùng, kèm kích thước, màu và viền, rồi biến những phông bạn đánh dấu thành style. Phông bạn chưa có sẽ được tìm trên Font FindeR: cài đặt ngay từ danh sách.
whatsNewFontsStep2=Font FindeR: mở cài đặt bằng bánh răng ở cuối bảng, rồi mở tab "Xem phông chữ".
whatsNewFontsResult2=Phông chữ đã cài có thể dùng trong kiểu ngay lập tức.
