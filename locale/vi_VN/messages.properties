whatsNewIntroSpot=Bạn tự làm mọi thao tác: hướng dẫn làm nổi bật nút cần dùng trong bảng.
whatsNewPracticeLine1=Chào mừng đến với TypeR 3.0! Văn bản này đi theo hình tròn của bóng thoại thay vì lấp đầy một hình chữ nhật.
