whatsNewPracticeLine11=Trong khi đó, ở đầu kia thành phố...
whatsNewPasteOnClickStep4=Vị trí 5 không có bóng thoại: trong Photoshop, chọn công cụ Rectangular Marquee (M) và vẽ một hình chữ nhật trong khung chấm. Dòng được dán ngay khi bạn thả chuột.
whatsNewPasteOnClickResult4=Hình chữ nhật hoặc lasso đặt chữ ở bất kỳ đâu, kể cả trên hình vẽ: tiện cho khung dẫn truyện và chữ ngoài bóng thoại.
whatsNewBubblesStep6=Khung dẫn truyện hoạt động tương tự, với kiểu được đánh dấu "Dẫn truyện". Nhấp vào cây bút của kiểu bạn muốn dùng cho chúng, hoặc sao chép lại kiểu thoại của bạn.
whatsNewBubblesCoach6=Đặt Loại bong bóng là Dẫn truyện, chọn phông chữ cho lời dẫn và tên khác nếu muốn, rồi nhấp Lưu.
whatsNewBubblesCoach6Reuse=Đặt Loại bong bóng là Dẫn truyện, rồi nhấp Lưu.
whatsNewBubblesResult6=Kiểu Dẫn truyện chỉ dùng cho các khung được nhận ra là lời dẫn truyện.
whatsNewBubblesResult6Existing=Kiểu "{name}" của bạn đã được đánh dấu Dẫn truyện: TypeR chỉ dùng nó cho các khung được nhận ra là lời dẫn truyện.
whatsNewBubblesStep7=Khung 10 là khung dẫn truyện: chọn nó bằng Magic Wand rồi dán dòng cuối vào đó.
whatsNewBubblesResult7=TypeR đã nhận ra khung dẫn truyện và dùng kiểu Dẫn truyện.
whatsNewBubblesResult7Missed=Kiểu Dẫn truyện chưa được dùng: chọn khung bằng Magic Wand, kiểm tra rằng kiểu nằm cùng thư mục với kiểu hiện tại rồi thử lại.
whatsNewPasteOnClickStep3Again=Đã hoàn tác! Giờ hãy dùng Magic Wand nhấp lại vào trong bóng 4 để dán lại.
whatsNewNextLocked=Hãy làm các bước của chương này để tiếp tục.
whatsNewChapterLocked=Hãy hoàn thành các chương trước đó trước.
whatsNewAlreadyOn=Đã bật: không cần làm gì, hướng dẫn sẽ tiếp tục.
whatsNewSkipStep=Bỏ qua
whatsNewSkipStepHint=Bạn đã biết điều này: chuyển sang bước tiếp theo.
whatsNewSkippedStep=Đã bỏ qua: nhấp để làm bước này.
whatsNewPrepStyleCreateText=Bạn chưa có kiểu nào: nhấp "Thêm kiểu cách" dưới danh sách kiểu để tạo kiểu thoại của bạn.
whatsNewPrepStyleCoach=Đặt tên cho kiểu, chọn phông chữ bạn dùng cho thoại, rồi nhấp Lưu.
whatsNewBubblesStep3Edit=Giờ hãy nhấp vào bút chì của bản sao để chỉnh sửa nó.
whatsNewBubblesCoach3=Đặt Loại bong bóng là Hét, chọn một phông chữ "hét" và tên khác nếu muốn, rồi nhấp Lưu.
whatsNewBubblesCoach3Reuse=Đặt Loại bong bóng là Hét, rồi nhấp Lưu.
whatsNewWorkflowCoach3=Các cỡ chữ đặt trước: thêm tối đa ba cỡ, rồi nhấp vào một cỡ để kích hoạt nó. Phím tắt "Cỡ chữ đặt trước tiếp theo" chuyển lần lượt qua chúng.
whatsNewFontsCoach=Font FindeR: tìm phông chữ, xem trước với chính văn bản của bạn và cài một phông chỉ với một cú nhấp.
